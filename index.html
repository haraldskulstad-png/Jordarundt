<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFC22E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Jorda Rundt">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Jorda Rundt: et reisespill for barn. Reis til 55 byer, ta jobber og lær om land, flagg og landemerker.">
<meta property="og:title" content="Jorda Rundt – reisespillet">
<meta property="og:description" content="Reis jorda rundt, ta jobber og lær om land, flagg og landemerker.">
<meta property="og:type" content="website">
<meta property="og:image" content="icons/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
@font-face{font-family:'Lilita One';font-weight:400;src:url(fonts/lilita-one-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-weight:600;src:url(fonts/nunito-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-weight:700;src:url(fonts/nunito-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Nunito';font-weight:800;src:url(fonts/nunito-latin-800-normal.woff2) format('woff2')}
</style>
<title>Jorda Rundt – reisespillet</title>
<style>
html{-webkit-touch-callout:none}
body{-webkit-user-select:none;user-select:none;overscroll-behavior-y:none}
input{-webkit-user-select:text;user-select:text}
:root{
  --bg:#eaf0f4; --card:#ffffff; --ink:#14213d; --muted:#5b6b82; --line:#d3dde6;
  --sea:#9fd0ea; --grid:#ffffff55; --border:#5b5a4f; --borderop:.75;
  --k0:#f6e3a1; --k1:#cfe8b0; --k2:#f4c7a8; --k3:#d8cdf0; --k4:#f1c4d8; --k5:#bfe3d6;
  --accent:#fca311; --accent-ink:#14213d; --teal:#1b7f8c; --good:#1f8a5b; --bad:#c23b3b;
  --hud:#14213d; --hud-ink:#f4f7fa; --soft:#f2f6f9; --shadow:0 2px 0 #14213d14;
  --f-display:'Lilita One',system-ui,sans-serif; --f-body:'Nunito',system-ui,-apple-system,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1623; --card:#14263a; --ink:#eaf1f8; --muted:#93a6bb; --line:#27405a;
    --sea:#0f3350; --grid:#ffffff12; --border:#b6c6d6; --borderop:.55;
    --k0:#6e6942; --k1:#4b6b45; --k2:#7a563f; --k3:#58547f; --k4:#76485f; --k5:#3f6b62;
    --accent:#fca311; --accent-ink:#14213d; --teal:#4fb7c4; --good:#46c08a; --bad:#ef6b6b;
    --hud:#0a1220; --hud-ink:#f4f7fa; --soft:#1a3049; --shadow:0 2px 0 #00000040;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1623; --card:#14263a; --ink:#eaf1f8; --muted:#93a6bb; --line:#27405a;
  --sea:#0f3350; --grid:#ffffff12; --border:#b6c6d6; --borderop:.55;
  --k0:#6e6942; --k1:#4b6b45; --k2:#7a563f; --k3:#58547f; --k4:#76485f; --k5:#3f6b62;
  --accent:#fca311; --accent-ink:#14213d; --teal:#4fb7c4; --good:#46c08a; --bad:#ef6b6b;
  --hud:#0a1220; --hud-ink:#f4f7fa; --soft:#1a3049; --shadow:0 2px 0 #00000040;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hud);z-index:10}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* kart */
svg.wm path[data-i]{stroke:var(--border);stroke-opacity:var(--borderop);stroke-width:1px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
svg.wm .k0{fill:var(--k0)}svg.wm .k1{fill:var(--k1)}svg.wm .k2{fill:var(--k2)}
svg.wm .k3{fill:var(--k3)}svg.wm .k4{fill:var(--k4)}svg.wm .k5{fill:var(--k5)}
svg.wm path.hs{stroke:var(--ink);stroke-opacity:1;stroke-width:2.5px}
svg.wm path.hc{stroke:var(--accent);stroke-opacity:1;stroke-width:3px}
.start .world svg path[data-i]{stroke:var(--border);stroke-opacity:var(--borderop);stroke-width:.6px;vector-effect:non-scaling-stroke}
.start .world .k0{fill:var(--k0)}.start .world .k1{fill:var(--k1)}.start .world .k2{fill:var(--k2)}
.start .world .k3{fill:var(--k3)}.start .world .k4{fill:var(--k4)}.start .world .k5{fill:var(--k5)}
.lbl{font-family:var(--f-display);font-weight:800;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-linejoin:round;pointer-events:none}
.clbl{font-family:var(--f-body);font-weight:700;font-style:italic;fill:var(--ink);opacity:.62;paint-order:stroke;stroke:var(--sea);stroke-opacity:.7;stroke-linejoin:round;pointer-events:none}
.kont{font-family:var(--f-display);font-weight:800;fill:var(--ink);opacity:.35;pointer-events:none;letter-spacing:.04em}
.pin{cursor:pointer}
.pulse{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(1.7)}}

/* start */
.start{max-width:520px;margin:0 auto;padding:18px 16px 40px}
.start .world{border-radius:18px;overflow:hidden;border:2px solid var(--ink);background:var(--sea)}
.start .world svg{display:block;width:100%;height:auto}
.start h1{font-size:44px;font-weight:800;margin:18px 0 6px;letter-spacing:-.02em}
.start p.lead{color:var(--muted);margin:0 0 18px;max-width:46ch}
.group{margin:16px 0}
.group>b{display:block;margin-bottom:8px;font-family:var(--f-display);font-size:18px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;box-shadow:var(--shadow)}
.choice b{display:block;font-family:var(--f-display);font-size:17px}
.choice span{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.choice.on{border-color:var(--ink);background:var(--accent);color:var(--accent-ink)}
.choice.on span{color:var(--accent-ink)}
.btn{background:var(--accent);color:var(--accent-ink);border:2px solid var(--ink);border-radius:14px;padding:12px 16px;font-weight:700;box-shadow:0 3px 0 var(--ink);min-height:48px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.block{display:block;width:100%}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.fine{color:var(--muted);font-size:13px;margin-top:18px}

/* hud */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--hud);color:var(--hud-ink);padding:8px 12px 10px}
.hud-row{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:8px;align-items:center;max-width:620px;margin:0 auto}
.stat{min-width:0}
.stat span{display:block;font-size:12px;opacity:.7}
.stat b{font-family:var(--f-display);font-size:18px;white-space:nowrap}
.menu-btn{background:transparent;border:2px solid #ffffff55;color:var(--hud-ink);border-radius:10px;width:42px;height:42px;font-size:18px}
.goal{max-width:620px;margin:8px auto 0;height:8px;background:#ffffff26;border-radius:6px;overflow:hidden}
.goal i{display:block;height:100%;background:var(--accent);transition:width .4s}
.goal-label{max-width:620px;margin:4px auto 0;font-size:12px;opacity:.8}

main{max-width:620px;margin:0 auto;padding:12px 12px 32px;display:grid;gap:12px}
.card{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.mapwrap{position:relative;border:2px solid var(--ink);border-radius:16px;overflow:hidden;background:var(--sea);width:100%}
.mapwrap svg{display:block;width:100%;height:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;min-height:38px}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.sel{display:flex;gap:10px;align-items:center;justify-content:space-between}
.sel b{font-family:var(--f-display);font-size:18px}
.sel small{color:var(--muted);display:block}
.here h2{font-size:26px}
.here .sub{color:var(--muted);margin:2px 0 8px}
.hero{border-radius:12px;overflow:hidden;border:2px solid var(--ink);margin-bottom:10px;line-height:0;background:var(--sea)}
.hero svg.art{display:block;width:100%;height:auto;aspect-ratio:2/1}
.famous{display:flex;gap:8px;align-items:center;margin:0 0 12px;color:var(--muted);font-size:14px}
.famous span.e{font-size:26px;line-height:1;background:var(--soft);border-radius:10px;padding:5px 7px}
.acts{display:grid;gap:10px}
.tag{display:inline-block;background:var(--good);color:#fff;border-radius:8px;font-size:12px;font-weight:700;padding:1px 8px;margin-left:6px;vertical-align:middle}
.log{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:14px;color:var(--muted)}
.log li:first-child{color:var(--ink);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* modal */
#modal{position:fixed;inset:0;z-index:30;display:none}
#modal.on{display:block}
.backdrop{position:absolute;inset:0;background:#0a122099}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:620px;margin:0 auto;max-height:92%;overflow:auto;background:var(--bg);border:2px solid var(--ink);border-bottom:0;border-radius:22px 22px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom,0px));animation:rise .22s ease-out}
@keyframes rise{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.mh h2{font-size:24px}
.x{background:var(--card);border:2px solid var(--ink);border-radius:10px;width:40px;height:40px;flex:none;font-size:18px}
.qrow{display:flex;gap:12px;align-items:center;margin:6px 0 14px}
.qrow .qe{font-size:46px;line-height:1;flex:none}
.q{font-family:var(--f-display);font-size:21px;font-weight:600;flex:1}
.say{background:var(--card);border:2px solid var(--ink);border-radius:12px;width:44px;height:44px;flex:none;font-size:20px}
.opts{display:grid;gap:10px}
.opt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px;text-align:left;min-height:50px;font-weight:600;font-size:17px}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,var(--card))}
.prog{color:var(--muted);font-size:14px;margin-bottom:4px}
.fb{min-height:26px;margin:10px 0;font-weight:700}
.result{text-align:center;padding:6px 0}
.result .big{font-size:56px;line-height:1}
.result h3{font-size:26px;margin:8px 0}
.result p{color:var(--muted);margin:6px 0 14px}
.stamp{display:inline-block;border:4px solid var(--good);color:var(--good);border-radius:14px;padding:6px 16px;font-family:var(--f-display);font-weight:800;font-size:22px;transform:rotate(-6deg);animation:stamp .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{from{transform:rotate(-6deg) scale(2.2);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
.tcard{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.tcard.focus{border-color:var(--ink);box-shadow:0 0 0 3px var(--accent)}
.tname{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tname span{color:var(--muted);font-size:14px}
.tdist{color:var(--muted);font-size:13px;margin-bottom:8px}
.topts{display:flex;flex-wrap:wrap;gap:8px}
.tbtn{background:var(--soft);border:2px solid var(--ink);border-radius:10px;padding:8px 10px;font-weight:700;font-size:14px}
.tbtn:disabled{opacity:.4;border-color:var(--line);cursor:not-allowed}
.pass{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pc{background:var(--card);border:2px solid var(--line);border-radius:12px;overflow:hidden}
.pc .hero{border:0;border-radius:0;margin:0}
.pc.off svg.art{filter:grayscale(1) opacity(.3)}
.pc div.t{padding:6px 8px;font-size:14px;line-height:1.25}
.pc div.t b{display:block;font-family:var(--f-display)}
.pc div.t small{color:var(--muted)}
ul.help{padding-left:18px;margin:6px 0 0;display:grid;gap:8px}

/* minispill */
.gbar{display:flex;justify-content:space-between;font-weight:700;margin-bottom:10px;font-family:var(--f-display);font-size:18px}
.mq{font-family:var(--f-display);font-size:24px;font-weight:600;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;min-height:90px}
.mrow{display:flex;gap:10px}
.mrow input{flex:1;min-width:0;font:700 22px var(--f-display);padding:10px 12px;border:2px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink)}
.field{position:relative;height:300px;background:var(--soft);border:2px solid var(--ink);border-radius:14px;overflow:hidden;touch-action:manipulation}
.tgt{position:absolute;width:52px;height:52px;border-radius:50%;border:2px solid var(--ink);background:var(--card);font-size:28px;line-height:1;padding:0;animation:pop .15s ease-out}
.tgt.hit{background:var(--good);transform:scale(1.2);transition:.15s}
.tgt.bad{background:var(--bad);transform:scale(.8);transition:.15s}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mc{aspect-ratio:1;background:var(--ink);color:var(--hud-ink);border:2px solid var(--ink);border-radius:12px;font-size:30px;padding:0}
.mc.open{background:var(--card);color:var(--ink)}
.mc.done{background:color-mix(in srgb,var(--good) 25%,var(--card));color:var(--ink);border-color:var(--good)}
.pads{display:grid;gap:10px}
.pads.p4{grid-template-columns:1fr 1fr}
.pads.p6{grid-template-columns:1fr 1fr 1fr}
.pad{aspect-ratio:1.3;border-radius:16px;border:2px solid var(--ink);font-size:36px;padding:0;transition:filter .1s,transform .1s}
.pad0{background:#f4a259}.pad1{background:#5b8e7d}.pad2{background:#8cb369}.pad3{background:#bc4b51}.pad4{background:#6d9dc5}.pad5{background:#d4a5e0}
.pad.lit{filter:brightness(1.35) saturate(1.3);transform:scale(.94);box-shadow:0 0 0 4px var(--accent)}
.status{text-align:center;font-weight:700;margin:12px 0 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.choices.c1{grid-template-columns:1fr}
.opt{display:flex;align-items:center;gap:12px}
.opt .oe{font-size:30px;line-height:1;flex:none;width:38px;text-align:center}
.hero{position:relative}
.cap{position:absolute;left:8px;bottom:8px;background:#14213dcc;color:#fff;border-radius:8px;padding:2px 8px;font-size:13px;font-weight:700;line-height:1.4}
.famous{flex-wrap:wrap}
.famous .fe,.fe{display:inline-flex;gap:4px;align-items:center;background:var(--soft);border-radius:10px;padding:4px 8px;font-size:14px;color:var(--ink)}
.fact{background:var(--soft);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px}
.conts{display:flex;gap:6px;flex-wrap:wrap;max-width:620px;margin:6px auto 0}
.cn{font-size:12px;padding:2px 8px;border-radius:999px;border:1.5px solid #ffffff55;opacity:.7}
.cn.on{background:var(--accent);color:#14213d;border-color:var(--accent);opacity:1;font-weight:700}
.tbar{position:relative;height:46px;background:var(--soft);border:2px solid var(--ink);border-radius:12px;overflow:hidden;margin:12px 0}
.tzone{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--good) 55%,transparent)}
.tcur{position:absolute;top:-2px;bottom:-2px;width:6px;background:var(--ink);border-radius:3px}
.sortbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigem{font-size:84px;text-align:center;line-height:1.1;margin:10px 0}
.flagbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.flagbtns .opt{justify-content:center;font-size:44px;min-height:80px}
.packgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pk{aspect-ratio:1;font-size:34px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:0}
.pk.on{border-color:var(--ink);background:var(--accent)}
.mapgame svg{display:block;width:100%;height:auto;border:2px solid var(--ink);border-radius:12px;touch-action:manipulation}
.bask{position:absolute;bottom:4px;font-size:44px;line-height:1;transform:translateX(-50%)}
.fall{position:absolute;top:-40px;font-size:34px;line-height:1;transform:translateX(-50%)}
.hotel{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;display:grid;gap:6px}
.hotel.on{border-color:var(--ink);box-shadow:0 0 0 3px var(--accent)}
.hotel span{color:var(--muted);font-size:14px}
.srow{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.srow .se{font-size:30px;line-height:1;flex:none}
.srow .st{flex:1;min-width:0}
.srow small{color:var(--muted);display:block;font-size:13px}
.srow .btn{min-height:40px;padding:6px 12px;flex:none;font-size:14px}
.pl{color:var(--good);font-weight:700}.mi{color:var(--bad);font-weight:700}
.ad{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;display:grid;gap:6px}
.ad.lock{opacity:.8}
.adh{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.ads{color:var(--muted);font-size:14px}
.adr{background:var(--soft);border-radius:10px;padding:6px 10px;font-size:14px}
.tdist{display:flex;justify-content:space-between;align-items:center;gap:8px}
.loc{background:var(--soft);border:2px solid var(--ink);border-radius:10px;padding:6px 10px;font-weight:700;font-size:13px;flex:none}
.hub{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:10px 4px;display:grid;gap:2px;justify-items:center;text-align:center;box-shadow:0 3px 0 var(--ink);min-height:92px}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tile .ti{font-size:30px;line-height:1.1}
.tile b{font-family:var(--f-display);font-size:14px}
.tile small{color:var(--muted);font-size:12px;line-height:1.2}
.tile.go{background:var(--accent);color:var(--accent-ink)}
.tile.go small{color:var(--accent-ink)}
.tile:disabled{opacity:.55;box-shadow:none;cursor:not-allowed}
.sight{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.sight.done{border-color:var(--good)}
.sight .se{font-size:32px;line-height:1;flex:none}
.sight .st{flex:1;min-width:0}
.sight small{display:block;color:var(--muted);font-size:13px}
.sight .chk{font-weight:800;color:var(--good);flex:none}
.oe.big{font-size:46px;width:auto;flex:1;text-align:center}
.hero img.ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero.photo{aspect-ratio:3/2;margin-bottom:10px;background:var(--soft)}
.cr{position:absolute;right:6px;top:6px;max-width:78%;background:#14213dcc;color:#fff;border-radius:6px;padding:1px 6px;font-size:10px;line-height:1.5;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sight img.sth{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none}
/* ===================== Tegneserie-tema: «reisedagbok med klistremerker» ===================== */
:root{
  --bg:#FFF0C9; --card:#FFFFFF; --ink:#2A1B3D; --ol:#2A1B3D; --muted:#6D5A7B; --line:#EBCF93; --note:#FFF3B8;
  --sea:#7DD3F5; --grid:#ffffff66; --border:#7A4A3A; --borderop:.85;
  --k0:#FFE08A; --k1:#B5E7A0; --k2:#FFC3A0; --k3:#D2C7FF; --k4:#FFBDD3; --k5:#A5E8DA;
  --accent:#FFC22E; --accent-ink:#2A1B3D; --coral:#FF5E7E; --teal:#13B5B1; --good:#1FAA6A; --bad:#E5405E;
  --hud:#FFC22E; --hud-ink:#2A1B3D; --soft:#FFF8E1; --shadow:0 4px 0 #2A1B3D;
  --f-display:'Lilita One','Fredoka',system-ui,sans-serif; --f-body:'Nunito',system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2A1B3D; --card:#3D2A5C; --ink:#FFF0D2; --ol:#12081F; --muted:#CDBBE0; --line:#57407C; --note:#4A3569;
  --sea:#1F4F8A; --grid:#ffffff14; --border:#EBCF93; --borderop:.5;
  --k0:#8C7440; --k1:#4F7A49; --k2:#86553F; --k3:#5B4E8C; --k4:#8C4C69; --k5:#3F7A6E;
  --coral:#FF7A93; --teal:#3FD3CF; --good:#4BD58F; --bad:#FF7A93; --soft:#4A3569; --shadow:0 4px 0 #12081F; --hud:#FFC22E; --hud-ink:#2A1B3D;
}}
:root[data-theme="dark"]{
  --bg:#2A1B3D; --card:#3D2A5C; --ink:#FFF0D2; --ol:#12081F; --muted:#CDBBE0; --line:#57407C; --note:#4A3569;
  --sea:#1F4F8A; --grid:#ffffff14; --border:#EBCF93; --borderop:.5;
  --k0:#8C7440; --k1:#4F7A49; --k2:#86553F; --k3:#5B4E8C; --k4:#8C4C69; --k5:#3F7A6E;
  --coral:#FF7A93; --teal:#3FD3CF; --good:#4BD58F; --bad:#FF7A93; --soft:#4A3569; --shadow:0 4px 0 #12081F; --hud:#FFC22E; --hud-ink:#2A1B3D;
}
body{font-size:17px;font-weight:600;background-color:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--ink) 11%,transparent) 1.6px,transparent 1.9px);background-size:26px 26px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;letter-spacing:.01em}
:focus-visible{outline:4px solid var(--coral);outline-offset:3px}

/* knapper */
.btn{font-family:var(--f-display);font-weight:400;font-size:19px;letter-spacing:.02em;background:var(--accent);color:var(--accent-ink);border:3px solid var(--ol);border-radius:16px;box-shadow:0 5px 0 var(--ol);padding:10px 16px;min-height:54px;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ol)}
.btn.ghost{background:var(--card);color:var(--ink)}
.btn:disabled{opacity:.55;box-shadow:0 2px 0 var(--ol);transform:translateY(3px)}

/* topplinje: billett i solgult */
.hud{background:var(--hud);color:var(--hud-ink);border-bottom:3px solid var(--ol);padding:8px 12px 10px}
.stat{background:#FFFBE9;color:#2A1B3D;border:2.5px solid var(--ol);border-radius:14px;padding:3px 8px 4px;box-shadow:0 2px 0 var(--ol)}
.stat span{font-size:10.5px;font-weight:800;opacity:1;color:#6D5A7B}
.hud-row{grid-template-columns:.9fr 1.45fr .95fr 1.2fr auto;gap:6px}
.stat span{white-space:nowrap}
.stat b{font-size:18px;font-weight:400;white-space:nowrap}
.menu-btn{width:46px;height:46px;border:3px solid var(--ol);background:#FFFBE9;color:#2A1B3D;border-radius:14px;box-shadow:0 3px 0 var(--ol);font-size:20px}
.goal{height:14px;background:#FFFBE9;border:2.5px solid var(--ol);border-radius:9px}
.goal i{background:var(--coral);border-radius:0 6px 6px 0}
.goal-label{font-weight:800;opacity:1;font-size:13px;margin-top:6px}
.cn{border:2px solid var(--ol);background:#FFFBE9;color:#2A1B3D;opacity:.8;font-weight:800}
.cn.on{background:var(--coral);color:#fff;opacity:1}

/* kart */
.mapwrap{border:3px solid var(--ol);border-radius:22px;box-shadow:0 5px 0 var(--ol)}
svg.wm path[data-i]{stroke-width:1.2px}
svg.wm path.hs{stroke:var(--coral);stroke-width:3px}
svg.wm path.hc{stroke:var(--ol);stroke-width:3.4px}
.chip{border:2.5px solid var(--ol);background:var(--card);color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:16px;min-height:42px;box-shadow:0 3px 0 var(--ol)}
.chip.on{background:var(--teal);color:#fff}
.lbl{font-family:var(--f-display);font-weight:400}
.clbl{font-weight:800}

/* kort */
.card{background:var(--card);border:3px solid var(--ol);border-radius:22px;box-shadow:0 5px 0 var(--ol)}
.here h2{font-size:36px;line-height:1;margin-top:2px}
.here .sub{color:var(--muted);font-weight:800;margin:4px 0 10px}
.tag{background:var(--teal);color:#fff;border:2px solid var(--ol);border-radius:999px;font-family:var(--f-display);font-weight:400;font-size:13px;padding:1px 10px;letter-spacing:.02em}
.fact{background:var(--note);color:var(--ink);border:2.5px dashed var(--ol);border-radius:16px;font-weight:700}
.famous .fe,.fe{background:var(--card);color:var(--ink);border:2px solid var(--ol);border-radius:999px;font-weight:800;box-shadow:0 2px 0 var(--ol);padding:4px 10px}
.hero{border:3px solid var(--ol);border-radius:18px;box-shadow:0 4px 0 var(--ol);transform:rotate(-.8deg)}
.pc .hero,.hero.photo{transform:none}
.pc .hero{border:0;border-radius:0;box-shadow:none}
.cap{background:var(--ol);color:#fff;border-radius:10px;font-family:var(--f-display);font-weight:400;font-size:14px;padding:2px 10px;letter-spacing:.02em}
.prog{font-weight:700}

/* byhub: seks klistremerker */
.hub{gap:10px}
.tile{color:#2A1B3D;border:3px solid var(--ol);border-radius:20px;box-shadow:0 5px 0 var(--ol);min-height:100px;padding:10px 4px 8px;transition:transform .08s,box-shadow .08s}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ol)}
.tile .ti{font-size:38px;line-height:1.05;filter:drop-shadow(0 2px 0 rgba(42,27,61,.25))}
.tile b{font-family:var(--f-display);font-weight:400;font-size:17px;letter-spacing:.02em}
.tile small{color:#2A1B3D;font-weight:800;opacity:.78}
.tile:nth-child(1){background:#D9D2FF}.tile:nth-child(2){background:#BFE9FF}.tile:nth-child(3){background:#FFD2B5}
.tile:nth-child(4){background:#BFF0CF}.tile:nth-child(5){background:#FFE9A0}
.tile.go{background:var(--coral);color:#fff}.tile.go small{color:#fff;opacity:1}
.tile:disabled{opacity:.65;filter:saturate(.5);box-shadow:0 2px 0 var(--ol);transform:translateY(3px)}

/* hjelpemodaler */
.backdrop{background:#2A1B3Daa}
.sheet{background-color:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--ink) 11%,transparent) 1.6px,transparent 1.9px);background-size:26px 26px;border:3px solid var(--ol);border-bottom:0;border-radius:28px 28px 0 0}
.sheet::before{content:"";display:block;width:56px;height:7px;border-radius:4px;background:var(--ol);opacity:.28;margin:-6px auto 12px}
.mh h2{font-size:30px}
.x{border:3px solid var(--ol);background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--ol);border-radius:14px;width:44px;height:44px;font-family:var(--f-display)}

/* quiz: snakkeboble med figur */
.qrow{position:relative;display:flex;align-items:flex-start;gap:14px;margin:14px 0 16px;padding-top:6px}
.mascot{flex:none;width:70px;height:70px}
.mascot svg{display:block;width:100%;height:100%;overflow:visible}
.mascot.big{width:128px;height:128px;margin:0 auto 4px}
.q{position:relative;flex:1;background:#fff;color:#2A1B3D;border:3px solid var(--ol);border-radius:20px;padding:12px 14px;font-family:var(--f-body);font-size:19px;font-weight:800;line-height:1.3;box-shadow:0 4px 0 var(--ol)}
.qrow>.q::before{content:"";position:absolute;left:-13px;top:22px;border:9px solid transparent;border-right:13px solid var(--ol)}
.qrow>.q::after{content:"";position:absolute;left:-8px;top:24px;border:7px solid transparent;border-right:10px solid #fff}
.qe{position:absolute;right:66px;top:-26px;width:50px;height:50px;font-size:28px;line-height:1;display:grid;place-items:center;background:var(--accent);border:3px solid var(--ol);border-radius:50%;transform:rotate(10deg);z-index:2;box-shadow:0 3px 0 var(--ol)}
.say{border:3px solid var(--ol);background:var(--card);box-shadow:0 3px 0 var(--ol);border-radius:14px;width:46px;height:46px;flex:none}
.opts{gap:12px}
.opt{background:#fff;color:#2A1B3D;border:3px solid var(--ol);border-radius:18px;box-shadow:0 4px 0 var(--ol);font-family:var(--f-body);font-weight:800;font-size:18px;min-height:60px;padding:10px 14px;transition:transform .08s,box-shadow .08s}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ol)}
.opt:disabled{color:#2A1B3D;opacity:1}
.opt .oe{font-size:32px}
.opt.right{background:#BFF0CF;animation:bounce .45s}
.opt.wrong{background:#FFC7D2;animation:shake .4s}
.opt[hidden]{display:none}
@keyframes bounce{0%{transform:scale(1)}40%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.fb{font-weight:800}

/* resultat og stempel */
.result h3{font-size:32px}
.result p{color:var(--muted);font-weight:700}
.stamp{border:5px double var(--coral);color:var(--coral);border-radius:16px;font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:.04em;background:#fff8}

/* lister og kort i modaler */
.tcard,.ad,.hotel,.srow,.sight,.pc,.choice{background:var(--card);color:var(--ink);border:3px solid var(--ol);border-radius:18px;box-shadow:0 4px 0 var(--ol)}
.tcard.focus{border-color:var(--ol);box-shadow:0 4px 0 var(--ol),0 0 0 4px var(--accent)}
.hotel.on,.sight.done{background:color-mix(in srgb,var(--good) 18%,var(--card))}
.tname b,.choice b,.ad b,.hotel b{font-family:var(--f-display);font-weight:400;font-size:19px}
.tbtn{background:var(--accent);color:#2A1B3D;border:2.5px solid var(--ol);border-radius:12px;box-shadow:0 3px 0 var(--ol);font-family:var(--f-display);font-weight:400;font-size:16px;padding:7px 11px}
.tbtn:disabled{background:var(--line);opacity:.7;box-shadow:none;border-color:var(--ol)}
.loc{border:2.5px solid var(--ol);background:var(--soft);color:var(--ink);font-family:var(--f-display);font-weight:400}
.adr{background:var(--note);border:2px dashed var(--ol)}
.choice.on{background:var(--accent);color:#2A1B3D}
.choice.on span{color:#2A1B3D}
.choice span{font-weight:700}

/* minispill */
.field,.tbar{border:3px solid var(--ol);border-radius:18px;box-shadow:0 4px 0 var(--ol)}
.mq{background:#fff;color:#2A1B3D;border:3px solid var(--ol);border-radius:18px;box-shadow:0 4px 0 var(--ol);font-family:var(--f-body);font-weight:800}
.mc{border:3px solid var(--ol);border-radius:14px;box-shadow:0 3px 0 var(--ol);background:var(--teal)}
.mc.open{background:#fff}.mc.done{background:#BFF0CF}
.pad{border:3px solid var(--ol);box-shadow:0 4px 0 var(--ol)}
.pk{border:3px solid var(--ol);border-radius:14px;box-shadow:0 3px 0 var(--ol)}
.gbar{font-size:20px}
.mrow input{border:3px solid var(--ol);border-radius:14px;font-family:var(--f-display);font-weight:400;background:#fff;color:#2A1B3D}

/* startskjerm */
.start .world{border:3px solid var(--ol);border-radius:22px;box-shadow:0 5px 0 var(--ol)}
.brand{display:flex;align-items:center;gap:6px;margin:18px 0 4px}
.brand .mascot{width:104px;height:104px}
.start h1{display:flex;flex-direction:column;gap:0;margin:0;font-size:62px;line-height:.92;color:var(--accent);-webkit-text-stroke:8px var(--ol);paint-order:stroke fill;text-shadow:0 5px 0 var(--ol);letter-spacing:.01em}
.start h1 span:nth-child(1){transform:rotate(-3deg);transform-origin:left bottom}
.start h1 span:nth-child(2){transform:rotate(1.5deg) translateX(18px)}
.start p.lead{font-weight:700;color:var(--ink);margin:10px 0 18px}
.group>b{font-family:var(--f-display);font-weight:400;font-size:22px}
.fine{font-weight:600}

/* konfetti */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti span{position:absolute;top:-40px;animation:fall 1.9s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(420deg)}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}

.hero svg.art{filter:saturate(1.3) contrast(1.03)}

.bellcard{display:grid;place-items:center;gap:6px;background:#fff;color:#2A1B3D;border:3px solid var(--ol);border-radius:20px;box-shadow:0 5px 0 var(--ol);padding:18px;margin:12px 0;min-height:150px;animation:bounce .35s;text-align:center}
.bellcard .bi{font-size:56px;line-height:1}
.bellcard b{font-family:var(--f-display);font-weight:400;font-size:22px}
.bellcard.pick{background:#BFF0CF}.bellcard.drop{background:#FFD2B5}
.cups{display:grid;grid-template-columns:repeat(auto-fit,minmax(68px,1fr));gap:10px;margin:12px 0}
.cup{position:relative;height:170px;border:3px solid var(--ol);border-radius:14px 14px 28px 28px;background:#fff;box-shadow:0 4px 0 var(--ol);overflow:hidden;padding:0;touch-action:manipulation}
.cup .fillbar{position:absolute;left:0;right:0;bottom:0;height:0;background:#8a5a3b}
.cup .zone{position:absolute;left:0;right:0;background:color-mix(in srgb,var(--good) 45%,transparent);border-top:2px dashed var(--good);border-bottom:2px dashed var(--good);z-index:2;pointer-events:none}
.cup .cem{position:absolute;top:6px;left:0;right:0;font-size:26px;z-index:3}
.cup.ok{background:#BFF0CF}.cup.bad{background:#FFC7D2}
.flock{display:grid;grid-template-columns:repeat(3,68px);grid-auto-rows:68px;gap:6px;justify-content:center;align-items:center;justify-items:center;margin:14px 0;min-height:216px}
.flock svg{width:60px;height:60px}
.arrows{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.arr{font-size:30px;font-family:var(--f-display);min-height:64px;border:3px solid var(--ol);border-radius:16px;background:#fff;color:#2A1B3D;box-shadow:0 4px 0 var(--ol);padding:0}
.arr:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ol)}
.arr:disabled{opacity:.6}
.clues{display:grid;gap:8px;margin:8px 0 12px}
.clue{background:var(--note);border:2.5px dashed var(--ol);border-radius:14px;padding:8px 12px;font-weight:800;color:var(--ink)}
.pots{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin:8px 0}
.pot{aspect-ratio:1;font-size:38px;border:3px solid var(--ol);border-radius:16px;background:#F2D7B5;box-shadow:0 4px 0 var(--ol);padding:0}
.pot.ok{background:#BFF0CF}
.tray{display:flex;gap:8px;justify-content:center;margin:10px 0;min-height:68px}
.flw{width:64px;height:64px;font-size:34px;border:3px solid var(--ol);border-radius:16px;background:#fff;box-shadow:0 4px 0 var(--ol);padding:0}
.flw.sel{background:var(--accent)}
.beats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
.beat{height:40px;border:2.5px solid var(--ol);border-radius:10px;background:#fff;display:grid;place-items:center;font-size:20px;color:#2A1B3D}
.beat.now{background:var(--accent)}.beat.hit{background:#BFF0CF}
.drum{display:block;width:100%;min-height:100px;font-size:52px;border:3px solid var(--ol);border-radius:22px;background:var(--coral);box-shadow:0 6px 0 var(--ol);padding:0;touch-action:manipulation}
.drum:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ol)}
.guests{display:grid;grid-template-columns:repeat(auto-fit,minmax(86px,1fr));gap:10px;margin:12px 0}
.guest{background:#fff;color:#2A1B3D;border:3px solid var(--ol);border-radius:18px;box-shadow:0 4px 0 var(--ol);padding:8px;text-align:center}
.guest .gf{font-size:46px;line-height:1.1}
.guest b{font-family:var(--f-display);font-weight:400;font-size:20px;display:block}
.tramsvg{display:block;width:100%;height:auto;background:var(--soft);border:3px solid var(--ol);border-radius:18px;box-shadow:0 4px 0 var(--ol);touch-action:manipulation}

.hofinput{display:block;width:100%;font:inherit;font-size:20px;font-weight:800;text-align:center;padding:12px;margin:12px 0;border:3px solid var(--ol);border-radius:16px;background:#fff;color:#2A1B3D;box-shadow:0 4px 0 var(--ol)}
.hofranks{display:grid;gap:6px;margin:12px 0;text-align:left}
.hrk{display:flex;justify-content:space-between;gap:10px;background:#fff;color:#2A1B3D;border:2.5px solid var(--ol);border-radius:12px;padding:6px 12px;font-weight:800}
.hoftabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.hoftab{font:inherit;font-weight:800;font-size:14px;border:3px solid var(--ol);border-radius:14px;background:#fff;color:#2A1B3D;padding:8px 6px;box-shadow:0 3px 0 var(--ol)}
.hoftab.on{background:var(--ol);color:#fff}
.hoflist{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.hofrow{display:grid;grid-template-columns:38px 1fr;gap:4px 8px;align-items:center;background:#fff;color:#2A1B3D;border:3px solid var(--ol);border-radius:16px;padding:8px 10px;box-shadow:0 3px 0 var(--ol)}
.hofrow.me{background:var(--note);outline:4px solid var(--coral)}
.hofrow .hr{font-family:var(--f-display);font-size:22px;text-align:center}
.hofrow .hn b{font-family:var(--f-display);font-weight:400;font-size:19px;display:block;overflow:hidden;text-overflow:ellipsis}
.hofrow .hn small{color:#6b5a85;font-weight:700}
.hofrow .hs{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.hofrow .m{font-size:13px;font-weight:700;background:#F4EBD3;border-radius:10px;padding:2px 8px}
.hofrow .m.act{background:var(--accent);font-weight:800;outline:2px solid var(--ol)}

.routesvg{display:block;width:100%;height:auto;border:3px solid var(--ol);border-radius:18px;box-shadow:0 4px 0 var(--ol);touch-action:manipulation}
.pgrid{display:grid;grid-template-columns:repeat(var(--w),1fr);gap:5px;margin:10px 0}
.pc{aspect-ratio:1;position:relative;font-size:22px;border:2.5px solid var(--ol);border-radius:12px;background:#DDF0C8;box-shadow:0 3px 0 var(--ol);padding:0;touch-action:manipulation;color:#2A1B3D}
.pc.s{background:#EAF4FF}.pc.x{background:#8E7FA3}.pc.on{background:var(--accent)}.pc.cur{outline:4px solid var(--coral)}
.pc i{position:absolute;right:4px;bottom:1px;font-size:11px;font-style:normal;font-weight:800}
.rline{font-family:var(--f-display);font-size:26px;text-align:center;margin:6px 0 12px}
.rline small{font:700 13px var(--f-body);color:#6b5a85}
.offers{display:grid;gap:10px;margin:8px 0}
.offer{text-align:left;background:#fff;color:#2A1B3D;border:3px solid var(--ol);border-radius:16px;box-shadow:0 4px 0 var(--ol);padding:10px 12px;display:grid;gap:4px;font:inherit}
.offer .oe{font-size:24px;line-height:1.15;word-break:break-all}
.offer b{font-family:var(--f-display);font-weight:400;font-size:20px}
.offer.right{background:#BFF0CF}.offer.wrong{background:#FFC7D2}
</style>

/* ---------- Hjelpere ---------- */

function dist(a,b){
  const R=6371,t=Math.PI/180;
  const dLat=(b.lat-a.lat)*t,dLon=(b.lon-a.lon)*t;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}

const progress=()=>S.goal==='v'?nCont():S.goal==='r'?Object.keys(S.stamps).length:Object.keys(S.certs).length;
const goalDone=()=>S.goal==='v'?(nCont()>=6&&S.cur==='oslo'):progress()>=target();

function advance(days,travel){S.day+=days;const rate=LIV[S.diff]*((!travel&&S.hotel==='dyrt')?2.5:1);const c=Math.min(S.money,Math.round(days*rate));S.money-=c;return c;}
const payFor=c=>Math.round(c.job.pay*RF[Math.min(S.jobCount[c.id]||0,RF.length-1)]);
const earn=n=>{S.money+=n;S.earned=(S.earned||0)+n;};

function options(a,b){
  const d=dist(a,b),m=S.diff==='g'?1.25:1,o=[];
  o.push({mode:'plane',icon:'✈️',cost:Math.round((70+d*0.16)*m),days:Math.max(1,Math.ceil(d/6000))});
  if(a.reg===b.reg&&d<=5000)o.push({mode:'train',icon:'🚆',cost:Math.round((35+d*0.06)*m),days:Math.max(1,Math.ceil(d/700))});
  if(a.port&&b.port)o.push({mode:'boat',icon:'🚢',cost:Math.round((25+d*0.04)*m),days:Math.max(1,Math.ceil(d/450))});
  return o;
}

}

  if(cleanup){cleanup();cleanup=null;}

const upp=()=>S.vb.w/(($('#map')&&$('#map').clientWidth)||360);
function inView(c){const b=REG[S.region].b;return c.lon>=b[0]&&c.lon<=b[2]&&c.lat<=b[1]&&c.lat>=b[3];}
function highlight(){
  $$('#mapsvg path.hc,#mapsvg path.hs').forEach(p=>p.classList.remove('hc','hs'));

function drawDyn(){
  const u=upp(),world=S.region==='world';
  let s='';
  S.path.forEach(p=>{const a=city(p[0]),b=city(p[1]);s+=`<line x1="${px(a.lon)}" y1="${py(a.lat)}" x2="${px(b.lon)}" y2="${py(b.lat)}" stroke="var(--coral)" stroke-width="${2.8*u}" stroke-dasharray="${7*u} ${5*u}" opacity=".85" stroke-linecap="round"/>`;});
  if(world)KONT.forEach(k=>{s+=`<text class="kont" x="${px(k[1])}" y="${py(k[2])}" font-size="${17*u}" text-anchor="middle">${k[0]}</text>`;});
  else if(S.names){
    const seen={};
    CITIES.forEach(c=>{if(seen[c.iso])return;seen[c.iso]=1;const p=CLBL[c.iso];if(!p)return;
      const vb=S.vb;if(p[0]<vb.x||p[0]>vb.x+vb.w||p[1]<vb.y||p[1]>vb.y+vb.h)return;
      s+=`<text class="clbl" x="${p[0]}" y="${p[1]}" font-size="${10.5*u}" stroke-width="${3*u}" text-anchor="middle">${flagOf(c.iso)} ${LANDNAVN[c.iso]||c.c}</text>`;});
  }
  CITIES.forEach(c=>{
    const x=px(c.lon),y=py(c.lat),cur=c.id===S.cur,vis=S.stamps[c.id],sel=c.id===S.sel;
    s+=`<g class="pin" data-act="pin" data-id="${c.id}">`;

    else if(sel)s+=`<circle class="pulse" cx="${x}" cy="${y}" r="${17*u}" fill="var(--teal)"/>`;
    s+=`<circle cx="${x}" cy="${y}" r="${(cur?6.5:5)*u}" fill="${cur?'var(--accent)':vis?'var(--good)':'#14213d'}" stroke="${sel?'var(--accent)':'#ffffff'}" stroke-width="${(sel?3:1.8)*u}"/>`;
    s+=`<circle cx="${x}" cy="${y}" r="${15*u}" fill="transparent"/>`;
    if(cur||sel||(!world&&inView(c))){
      const lp=c.lp||'u',fs=11.5*u;
      let lx=x,ly=y-9*u,an='middle';

      else if(lp==='r'){lx=x+9*u;ly=y+4*u;an='start';}
      s+=`<text class="lbl" x="${lx}" y="${ly}" font-size="${fs}" stroke-width="${3.5*u}" text-anchor="${an}">${c.n}</text>`;
    }
    s+='</g>';
  });
  $('#dyn').innerHTML=s;
}

/* ---------- Reise ---------- */
function compass(a,b){
  /* retning slik den ser ut på det flate kartet (ikke korteste vei over kloden) */
  let dlon=b.lon-a.lon;if(dlon>180)dlon-=360;if(dlon<-180)dlon+=360;
  const deg=(Math.atan2(dlon,b.lat-a.lat)*180/Math.PI+360)%360;
  return ['nord','nordøst','øst','sørøst','sør','sørvest','vest','nordvest'][Math.round(deg/45)%8];
}
function openTravel(focus){
  const here=city(S.cur);
  const list=CITIES.filter(c=>c.id!==S.cur).sort((a,b)=>dist(here,a)-dist(here,b));
  const html=list.map(c=>{
    const d=Math.round(dist(here,c)),os=options(here,c);
    const nw=!S.conts[ctOf(c)]?' <span class="tag" style="background:var(--teal)">ny verdensdel</span>':'';
    return `<div class="tcard ${c.id===focus?'focus':''}" id="t-${c.id}">
      <div class="tname"><b>${flagOf(c.iso)} ${c.n}</b><span>${c.c}${S.stamps[c.id]?' ✔':''}</span></div>
      <div class="tdist"><span>${fmt(d)} km mot ${compass(here,c)} · ${CONTNAME[ctOf(c)]}${nw}</span><button class="loc" data-act="locate" data-id="${c.id}" aria-label="Vis ${c.n} på kartet">📍 Vis på kartet</button></div>
      <div class="topts">${os.map(o=>`<button class="tbtn" data-act="go" data-to="${c.id}" data-m="${o.mode}" ${o.cost>S.money?'disabled':''}>${o.icon} ${fmt(o.cost)} kr · ${o.days} d</button>`).join('')}</div>
    </div>`;}).join('');
  openModal(head('Hvor vil du reise?')+`<p class="prog">Du har ${fmt(S.money)} kr. Mat og overnatting koster ${LIV[S.diff]} kr for hver dag som går. ✈️ fly, 🚆 tog (samme område), 🚢 båt (havnebyer).</p>`+html);
  if(focus){const el=$('#t-'+focus);if(el&&el.scrollIntoView)el.scrollIntoView({block:'center'});}
}
function doTravel(toId,mode){
  if(S.busy)return;
  const a=city(S.cur),b=city(toId);
  const o=options(a,b).find(x=>x.mode===mode);
  if(!o||o.cost>S.money)return;
  closeModal();
  S.busy=true;S.money-=o.cost;const liv=advance(o.days,true);
  const wasRegion=S.region;
  /* vis hele ruten: bytt til verdenskart hvis en av byene ligger utenfor utsnittet */
  if(S.region!=='world'&&!(inView(a)&&inView(b))){S.region='world';setView();drawDyn();renderChips();}
  const svg=$('#mapsvg'),u=upp();
  const x1=px(a.lon),y1=py(a.lat),x2=px(b.lon),y2=py(b.lat),d=dist(a,b);
  const mk=(tag,at)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);svg.appendChild(e);return e;};
  /* linjen tegnes gradvis fra avreisebyen mot målet */
  const ln=mk('line',{x1:x1,y1:y1,x2:x1,y2:y1,stroke:'var(--coral)','stroke-width':3.6*u,'stroke-linecap':'round'});
  /* målet markeres med ring og navn, så du ser hvor byen ligger */
  const ring=mk('circle',{cx:x2,cy:y2,r:11*u,fill:'none',stroke:'var(--coral)','stroke-width':2.8*u,'stroke-dasharray':(4*u)+' '+(3*u)});
  const lab=mk('text',{x:x2,y:y2-15*u,'font-size':12.5*u,'text-anchor':'middle','class':'lbl','stroke-width':3.8*u});lab.textContent=b.n;
  const m=mk('text',{'font-size':26*u,'text-anchor':'middle'});m.textContent=o.icon;
  const t0=performance.now(),dur=Math.min(2400,900+d/9);
  function step(t){
    const k=Math.min(1,(t-t0)/dur),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    const cx=x1+(x2-x1)*e,cy=y1+(y2-y1)*e;
    ln.setAttribute('x2',cx);ln.setAttribute('y2',cy);
    m.setAttribute('x',cx);
    m.setAttribute('y',cy-(mode==='plane'?Math.sin(k*Math.PI)*16*u:0)-4*u);
    if(k<1)requestAnimationFrame(step);
    else{
      [ln,ring,lab,m].forEach(el=>el.remove());
      S.path.push([a.id,b.id,mode]);
      S.cur=toId;S.sel=null;S.busy=false;S.hotel='billig';S.ci=null;
      const newCont=!S.conts[ctOf(b)];
      S.conts[ctOf(b)]=true;S.countries[b.iso]=true;
      S.region=wasRegion;
      if(S.region!=='world'&&!inView(b))S.region=b.rg;
      const w={plane:'fløy',train:'tok toget',boat:'tok båten'}[mode];
      addLog(`Du ${w} til ${flagOf(b.iso)} ${b.n}. Billett ${fmt(o.cost)} kr og mat/overnatting ${fmt(liv)} kr (${o.days} ${o.days>1?'dager':'dag'}).`);
      if(newCont)addLog(`🌍 Ny verdensdel: ${CONTNAME[ctOf(b)]}!`);
      randomEvent();
      render();checkWin();
    }
  }
  requestAnimationFrame(step);
}

const qEx=(c,i)=>autoEx(c,c.q[i][2])||EXPL[c.id+':'+i]||'';

function autoEx(c,aStr){
  const lab=parseOpt(aStr).l.toLowerCase(),list=SIGHTS[c.id]||[];
  const hay=s=>(s[1]+' '+s[2]).toLowerCase();
  if(lab.length>3)for(const s of list){if(hay(s).includes(lab)||s[1].toLowerCase().includes(lab))return s[1]+': '+s[2];}
  const stems=lab.split(/[\s,().-]+/).filter(w=>w.length>=5).map(w=>w.slice(0,6));
  for(const s of list){if(stems.some(w=>hay(s).includes(w)))return s[1]+': '+s[2];}
  return '';
}
function qCountry(c,n){
  const others=shuffle(gameIsos().filter(i=>i!==c.iso));
  const same=others.filter(i=>CITIES.some(x=>x.iso===i&&ctOf(x)===ctOf(c))).slice(0,1);
  const rest=others.filter(i=>!same.includes(i));
  const opts=[c.iso].concat(same,rest).slice(0,n);
  return {id:'g:cn:'+c.id,e:'🗺️',t:'Hvilket land ligger '+c.n+' i?',a:flagOpt(c.iso),o:shuffle(opts.map(flagOpt)),ex:c.n+' ligger i '+LANDNAVN[c.iso]+', i '+CONTNAME[ctOf(c)]+'.'};
}
function qContinent(c,n){
  const ct=ctOf(c),keys=['europe','asia','africa','namer','samer','oce'];
  const opt=k=>CEM[k]+' '+CONTNAME[k];
  const opts=[ct].concat(shuffle(keys.filter(k=>k!==ct)).slice(0,n-1));
  return {id:'g:ct:'+c.id,e:'🧭',t:'På hvilken verdensdel ligger '+c.n+'?',a:opt(ct),o:shuffle(opts.map(opt)),ex:c.n+' ligger i '+LANDNAVN[c.iso]+', som er i '+CONTNAME[ct]+'.'};
}
const pickIso=c=>Math.random()<.5?c.iso:gameIsos()[rnd(0,gameIsos().length-1)];
function qFlagFor(iso,n){
  const opts=[iso].concat(shuffle(gameIsos().filter(i=>i!==iso)).slice(0,n-1));
  return {id:'g:ff:'+iso,e:'🏳️',t:'Hvilket flagg hører til '+LANDNAVN[iso]+'?',a:flagOf(iso)+' ',o:shuffle(opts.map(i=>flagOf(i)+' ')),ex:flagOf(iso)+' er flagget til '+LANDNAVN[iso]+'.'};
}
function qFlagToCountry(iso,n){
  const opt=i=>'🏳️ '+LANDNAVN[i];
  const opts=[iso].concat(shuffle(gameIsos().filter(i=>i!==iso)).slice(0,n-1));
  return {id:'g:fc:'+iso,e:flagOf(iso),t:'Hvilket land har dette flagget?',a:opt(iso),o:shuffle(opts.map(opt)),ex:flagOf(iso)+' er flagget til '+LANDNAVN[iso]+'.'};
}
function qDirection(n){
  const dirs=[['nord','lat',1,9],['sør','lat',-1,9],['øst','lon',1,18],['vest','lon',-1,18]];
  for(let t=0;t<40;t++){
    const d=dirs[rnd(0,3)],set=shuffle(CITIES).slice(0,n);
    if(new Set(set.map(x=>x.iso)).size<set.length)continue;
    const v=set.map(x=>d[2]*x[d[1]]).sort((a,b)=>b-a);
    if(v[0]-v[1]<d[3])continue;
    const best=set.find(x=>d[2]*x[d[1]]===v[0]);
    return {id:'g:dir:'+d[0]+':'+set.map(x=>x.id).sort().join(','),e:'🧭',t:'Hvilken av disse byene ligger lengst mot '+d[0]+' på kartet?',a:cityOpt(best),o:shuffle(set.map(cityOpt)),ex:'På kartet ligger '+best.n+' lengst mot '+d[0]+' av disse byene.'};
  }
  return null;
}
function qNearest(c,n){
  const sorted=CITIES.filter(x=>x.id!==c.id).sort((a,b)=>dist(c,a)-dist(c,b));
  const cor=sorted[rnd(0,4)],dc=dist(c,cor);
  const far=shuffle(sorted.filter(x=>dist(c,x)>Math.max(dc*1.8,dc+1500)&&x.iso!==cor.iso));
  if(far.length<n-1)return null;
  const set=[cor].concat(far.slice(0,n-1));
  return {id:'g:near:'+c.id+':'+cor.id,e:'📏',t:'Hvilken av disse byene ligger nærmest '+c.n+'?',a:cityOpt(cor),o:shuffle(set.map(cityOpt)),ex:cor.n+' ligger rundt '+fmt(Math.round(dc/10)*10)+' km fra '+c.n+'.'};
}
function qLandmark(n){
  const ids=[...LMOK],L=city(ids[rnd(0,ids.length-1)]);
  const set=[L].concat(shuffle(CITIES.filter(x=>x.id!==L.id&&x.iso!==L.iso)).slice(0,n-1));
  return {id:'g:lm:'+L.id,e:SIGHTS[L.id][0][0],t:'I hvilken by finner du «'+L.lm+'»?',a:cityOpt(L),o:shuffle(set.map(cityOpt)),ex:L.lm+' ligger i '+L.n+', '+LANDNAVN[L.iso]+'.',nohero:true};
}
function qFact(c,i){
  const list=SIGHTS[c.id],s=list[i];if(!s)return null;
  const f=s[2].toLowerCase();
  const leak=list.some(x=>{const nm=x[1].toLowerCase();return f.includes(nm)||nm.split(/[\s-]+/).some(w=>w.length>=4&&f.includes(w));});
  if(leak)return null;
  return {id:'f:'+c.id+':'+i,e:'🔎',t:'Hvilket sted i '+c.n+' passer til dette? «'+s[2]+'»',a:s[0]+' '+s[1],o:shuffle(list.map(x=>x[0]+' '+x[1])),ex:s[1]+': '+s[2]};
}
function pickQuestions(c){
  const n=S.diff==='g'?4:3,seen=S.qSeen;
  const authored=shuffle(c.q.map((q,i)=>({id:'a:'+c.id+':'+i,e:q[0],t:q[1],a:q[2],o:shuffle(q.slice(2)),ex:qEx(c,i)})));
  const take=arr=>arr.find(x=>!seen[x.id])||arr[0];
  const out=[take(authored)];
  const first=out[0],firstEx=autoEx(c,first.a),firstLab=parseOpt(first.a).l.toLowerCase();
  const facts=shuffle([0,1,2]).map(i=>qFact(c,i)).filter(Boolean).filter(f=>f.ex!==firstEx&&parseOpt(f.a).l.toLowerCase()!==firstLab);
  out.push(facts.length?take(facts):take(authored.filter(x=>!out.includes(x))));
  const gens=shuffle([()=>qCountry(c,n),()=>qContinent(c,n),()=>qFlagFor(pickIso(c),n),()=>qFlagToCountry(pickIso(c),n),()=>qDirection(n),()=>qNearest(c,n),()=>qLandmark(n)]);
  let q3=null;
  const dupAns=q=>out.some(o=>parseOpt(o.a).l.toLowerCase()===parseOpt(q.a).l.toLowerCase());
  for(const f of gens){const q=f();if(q&&!seen[q.id]&&!dupAns(q)){q3=q;break;}}
  if(!q3)for(const f of gens){const q=f();if(q&&!dupAns(q)){q3=q;break;}}
  out.push(q3||take(authored.filter(x=>!out.includes(x))));
  out.forEach(q=>{seen[q.id]=1;});
  return shuffle(out);
}

function speak(t){
  try{
    if(!('speechSynthesis' in window))return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);u.lang='nb-NO';u.rate=.9;speechSynthesis.speak(u);
  }catch(e){}
}
function startQuiz(){
  const c=city(S.cur);
  if(S.stamps[c.id])return;
  if(S.quizTries[c.id])advance(1);
  S.quizTries[c.id]=(S.quizTries[c.id]||0)+1;
  const qs=pickQuestions(c);
  const need=S.diff==='g'?3:2,canSpeak='speechSynthesis' in window;
  let i=0,right=0,hints=(S.seen[c.id]||[]).length;
  function step(){
    if(i>=qs.length)return end();
    const q=qs[i];
    openModal(head('Byquiz: '+c.n)+(q.nohero?'':hero(c.id))+`<div class="prog">Spørsmål ${i+1} av ${qs.length} · riktige: ${right}</div>
      <div class="qrow"><div class="qe" aria-hidden="true">${q.e}</div><div class="q">${q.t}</div>${canSpeak?'<button class="say" data-act="say" aria-label="Les opp spørsmålet">🔊</button>':''}</div>
      <div class="opts">${q.o.map((o,k)=>{const p=parseOpt(o);return `<button class="opt" data-act="ans" data-k="${k}"><span class="oe ${p.l?'':'big'}">${p.e}</span><span>${p.l}</span></button>`;}).join('')}</div><div id="hintrow">${hints>0?`<button class="btn ghost block" data-act="hint" style="margin-top:10px">💡 Hint (${hints} igjen)</button>`:''}</div><div id="qnext"></div>`);
    window.__hint=function(){
      if(hints<=0)return;
      const wrong=$$('.opt',mroot).filter((b,n)=>!b.disabled&&!b.hidden&&q.o[n]!==q.a);
      if(wrong.length<2)return;
      wrong[rnd(0,wrong.length-1)].hidden=true;hints--;
      const vis=$$('.opt',mroot).filter(b=>!b.hidden).length;
      $('#hintrow').innerHTML=(hints>0&&vis>2)?`<button class="btn ghost block" data-act="hint" style="margin-top:10px">💡 Hint (${hints} igjen)</button>`:(hints>0?`<p class="prog">Du har ${hints} hint igjen til neste spørsmål.</p>`:'');
    };
    window.__say=()=>speak(q.t+'. '+q.o.map(o=>parseOpt(o).l||'et flagg').join('. Eller. '));
    window.__ans=function(k){
      window.__ans=null;window.__hint=null;{const hr=$('#hintrow');if(hr)hr.innerHTML='';}
      const ok=q.o[k]===q.a;if(ok)right++;
      $$('.opt',mroot).forEach((b,n)=>{b.disabled=true;if(q.o[n]===q.a)b.classList.add('right');else if(n===k)b.classList.add('wrong');});
      $('#qnext').innerHTML=`<p class="fb" style="color:${ok?'var(--good)':'var(--bad)'}">${ok?'Riktig! +50 kr':'Feil. Riktig svar: '+(parseOpt(q.a).l||parseOpt(q.a).e)}</p>${q.ex?`<div class="fact">💡 ${q.ex}</div>`:''}<button class="btn block" data-act="qnext">${i+1>=qs.length?'Se resultat':'Neste spørsmål'}</button>`;
      window.__next=function(){window.__next=null;i++;step();};
    };
  }
  function end(){
    const pass=right>=need;
    earn(right*50);
    let msg=`Du fikk ${right} av ${qs.length} riktige og tjente ${right*50} kr.`;
    if(pass){S.stamps[c.id]=true;earn(100);msg+=' Stempelet gir deg 100 kr i bonus.';addLog(`Stempel i passet fra ${c.n}!`);}
    else{msg+=` Du trenger ${need} riktige for stempel.`;addLog(`Ingen stempel i ${c.n} denne gangen.`);}
    openModal(`<div class="result"><div class="mascot big">${mascot(pass?'win':'hmm')}</div>${pass?'<div class="stamp">STEMPLET</div>':''}<h3>${pass?'Flott jobba!':'Ikke helt denne gangen'}</h3><p>${msg}</p><div class="fact" style="text-align:left">💡 ${c.fa}</div>${pass?'':'<p>Du kan prøve igjen, men det koster en dag.</p>'}<button class="btn block" data-act="cont">Fortsett</button></div>`);
  }
  step();
}

/* Hotellportier: hold oversikt over kofferter på vogna (arbeidsminne som oppdateres) */
function gameBellhop(el,job,fin){
  const g=GH(),ncol=g?4:3,nev=g?12:8,gap=(g?1100:1700)/SP(),need=Math.max(1,(g?3:2)-(EZ()?1:0));
  const COL=[['🟥','røde'],['🟦','blå'],['🟩','grønne'],['🟨','gule']].slice(0,ncol);
  const cnt=COL.map(()=>0),ev=[];
  for(let i=0;i<nev;i++){
    const total=cnt.reduce((a,b)=>a+b,0),have=cnt.map((x,k)=>x>0?k:-1).filter(k=>k>=0);
    let act='pick',c=rnd(0,ncol-1);
    if(have.length&&(total>=4||Math.random()<.4)){act='drop';c=have[rnd(0,have.length-1)];cnt[c]--;}
    else{let t=0;while(cnt[c]>=3&&t++<12)c=rnd(0,ncol-1);if(cnt[c]>=3){act='drop';cnt[c]--;}else cnt[c]++;}

    i++;delay(step,gap);
  }

    if(dead)return;

    }));

}

  const g=GH(),n=g?4:3,dur=25,need=(g?12:8)-(EZ()?2:0),lo=.6,hi=.88;

/* Gartner: plant blomstene i riktig rekkefølge etter ledetråder (logikk) */
const FLW=['🌷','🌻','🌹','🌼'];
function permsOf(n){const out=[];(function go(a,rest){if(!rest.length){out.push(a);return;}rest.forEach((x,i)=>go(a.concat(x),rest.filter((_,j)=>j!==i)));})([],[...Array(n).keys()]);return out;}
function makePlant(n){
  for(let tries=0;tries<40;tries++){
    const pos=shuffle([...Array(n).keys()]);          // pos[f] = plass for blomst f
    const cand=[];
    for(let a=0;a<n;a++){
      if(pos[a]===0)cand.push({t:`${FLW[a]} står helt til venstre`,ok:p=>p[a]===0});
      if(pos[a]===n-1)cand.push({t:`${FLW[a]} står helt til høyre`,ok:p=>p[a]===n-1});
      if(n%2===1&&pos[a]===(n-1)/2)cand.push({t:`${FLW[a]} står i midten`,ok:p=>p[a]===(n-1)/2});
      for(let b=0;b<n;b++){
        if(a===b)continue;
        if(pos[a]<pos[b])cand.push({t:`${FLW[a]} står til venstre for ${FLW[b]}`,ok:p=>p[a]<p[b]});
        if(a<b&&Math.abs(pos[a]-pos[b])===1)cand.push({t:`${FLW[a]} og ${FLW[b]} står rett ved siden av hverandre`,ok:p=>Math.abs(p[a]-p[b])===1});
        if(a<b&&Math.abs(pos[a]-pos[b])>1)cand.push({t:`${FLW[a]} og ${FLW[b]} står ikke ved siden av hverandre`,ok:p=>Math.abs(p[a]-p[b])>1});
      }
    }
    const all=permsOf(n),chosen=[];let sols=all;
    for(const c of shuffle(cand)){
      if(sols.length===1)break;
      const ns=sols.filter(c.ok);if(ns.length<sols.length){chosen.push(c);sols=ns;}
    }
    if(sols.length===1&&chosen.length<=n+1)return {pos,clues:chosen.map(c=>c.t)};
  }
  return null;
}
function gamePlant(el,job,fin){
  const g=GH(),n=g?4:3,rounds=2,need=Math.max(1,(g?2:1)-(EZ()&&g?1:0));
  let r=0,okP=0,dead=false,sel=-1,tries=0,P=null,slots=[];
  el.innerHTML=`<div class="gbar"><span id="gt">Bed 1 / ${rounds}</span><span id="gs">Riktige: 0 / ${need}</span></div><div class="clues" id="cl"></div><div class="pots" id="pots"></div><div class="tray" id="tray"></div><button class="btn block" id="pdone" disabled>Plant!</button><div class="fb" id="pfb"></div>`;
  function newBed(){
    P=makePlant(n);slots=Array(n).fill(-1);sel=-1;tries=0;
    $('#cl',el).innerHTML=P.clues.map(c=>`<div class="clue">💡 ${c}</div>`).join('');
    if(window.__test)el.dataset.sol=JSON.stringify([...Array(n).keys()].map(k=>P.pos.indexOf(k)));
    $('#gt',el).textContent=`Bed ${r+1} / ${rounds}`;$('#pfb',el).textContent='';paint();
  }
  function paint(mark){
    $('#pots',el).innerHTML=slots.map((f,k)=>`<button class="pot ${mark&&mark[k]?'ok':''}" data-s="${k}" aria-label="Potte ${k+1}">${f>=0?FLW[f]:'🪴'}</button>`).join('');
    const placed=new Set(slots.filter(x=>x>=0));
    $('#tray',el).innerHTML=[...Array(n).keys()].filter(f=>!placed.has(f)).map(f=>`<button class="flw ${sel===f?'sel':''}" data-f="${f}">${FLW[f]}</button>`).join('');
    $('#pdone',el).disabled=slots.some(x=>x<0);
  }
  el.addEventListener('click',e=>{
    if(dead)return;
    const f=e.target.closest('.flw'),p=e.target.closest('.pot');
    if(f){sel=sel===+f.dataset.f?-1:+f.dataset.f;paint();}
    else if(p){const k=+p.dataset.s;
      if(sel>=0){slots[k]=sel;sel=-1;}else if(slots[k]>=0)slots[k]=-1;
      paint();}
  });
  $('#pdone',el).addEventListener('click',()=>{
    if(dead)return;tries++;
    const correct=slots.map((f,k)=>P.pos[f]===k);
    if(correct.every(Boolean)){okP++;$('#gs',el).textContent=`Riktige: ${okP} / ${need}`;paint(correct);$('#pfb',el).style.color='var(--good)';$('#pfb',el).textContent='Alle blomstene står riktig! 🌸';return next();}
    paint(correct);const fb=$('#pfb',el);fb.style.color='var(--bad)';
    if(tries>=2){const sol=[...Array(n).keys()].map(k=>P.pos.indexOf(k));slots=sol;paint(sol.map(()=>true));fb.textContent='Slik skulle det stå.';return next();}
    fb.textContent='Ikke helt riktig. De grønne potene står riktig. Prøv igjen!';
  });
  function next(){
    $('#pdone',el).disabled=true;r++;
    delay(()=>{if(dead)return;if(r>=rounds){dead=true;return fin(okP>=need,`Du plantet ${okP} av ${rounds} bed riktig`);}newBed();},1500/Math.min(SP(),4));
  }
  newBed();
  return ()=>{dead=true;};
}

/* Trommeslager: slå takten (rytme og timing) */
function gameRhythm(el,job,fin){
  const g=GH(),bpm=g?96:72,beatMs=60000/bpm/SP(),lead=4,bars=4,total=lead+bars*4,win=Math.min(260,beatMs*.34*Math.max(1,SP()>1?1:1));
  const notes=new Set();
  for(let b=0;b<bars;b++){notes.add(lead+b*4);for(let k=1;k<4;k++)if(Math.random()<(g?.5:.3))notes.add(lead+b*4+k);}
  const N=notes.size,need=Math.max(3,Math.ceil(N*(g?.8:.6))-(EZ()?1:0)),maxWrong=g?3:6;
  let hit=new Set(),wrong=0,dead=false,raf=0,t0=0,started=false,lastTick=-1;
  let ac=null;try{const AC=window.AudioContext||window.webkitAudioContext;if(AC){ac=new AC();if(ac.resume)ac.resume();}}catch(e){ac=null;}
  const snd=(f,d,v)=>{try{if(!ac)return;const o=ac.createOscillator(),gn=ac.createGain();o.type='triangle';o.frequency.value=f;gn.gain.setValueAtTime(v,ac.currentTime);gn.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(gn);gn.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}};
  el.innerHTML=`<div class="gbar"><span id="gt">Tell: 1 2 3 4</span><span id="gs">Treff: 0 / ${need}</span></div><p class="prog">Trykk på trommen akkurat når det gule feltet står på en 🥁. Lyd hjelper, men er ikke nødvendig.</p><div class="beats" id="beats">${[...Array(bars*4).keys()].map(k=>`<div class="beat" data-i="${lead+k}" data-note="${notes.has(lead+k)?1:0}">${notes.has(lead+k)?'🥁':'·'}</div>`).join('')}</div><button class="drum" id="drum" aria-label="Tromme">🥁</button><div class="fb" id="rfb"></div>`;
  const cells=$$('.beat',el);
  function tap(){
    if(dead||!started)return;
    const now=performance.now(),b=(now-t0)/beatMs,idx=Math.round(b),err=Math.abs(b-idx)*beatMs;
    snd(180,.12,.5);
    if(idx<lead||idx>=total){return;}
    const c=cells[idx-lead];
    if(notes.has(idx)&&!hit.has(idx)&&err<=win){hit.add(idx);c.classList.add('hit');$('#gs',el).textContent=`Treff: ${hit.size} / ${need}`;}
    else if(!notes.has(idx)||err>win){wrong++;const fb=$('#rfb',el);fb.style.color='var(--bad)';fb.textContent='Ups, ikke her!';delay(()=>{const f=$('#rfb',el);if(f)f.textContent='';},500/Math.min(SP(),4));}
  }
  $('#drum',el).addEventListener('pointerdown',e=>{e.preventDefault();tap();});
  function loop(){
    if(dead)return;
    const now=performance.now(),b=(now-t0)/beatMs,idx=Math.floor(b+.02);
    if(idx!==lastTick&&idx>=0&&idx<total){lastTick=idx;snd(idx<lead?520:380,.05,.18);
      cells.forEach(c=>c.classList.remove('now'));
      if(idx>=lead)cells[idx-lead].classList.add('now');
      else $('#gt',el).textContent='Tell: '+[...Array(idx+1).keys()].map(x=>x+1).join(' ');
      if(idx>=lead)$('#gt',el).textContent=`Takt ${Math.floor((idx-lead)/4)+1} / ${bars}`;}
    if(b>total-0.4){dead=true;return fin(hit.size>=need&&wrong<=maxWrong,`Du traff ${hit.size} av ${N} slag, med ${wrong} feil`);}
    raf=requestAnimationFrame(loop);
  }
  t0=performance.now()+beatMs;started=true;raf=requestAnimationFrame(loop);
  return ()=>{dead=true;cancelAnimationFrame(raf);try{if(ac&&ac.close)ac.close();}catch(e){}};
}

  };
  const OUTS={S1:['a0','a1'],S2:['b0','b1'],M:['m0','m1','m2']},STN={R:0,B:1,G:2};
  const sw={S1:0,S2:0,M:1};
  Object.values(EDGE).forEach(e=>{e.seg=[];e.len=0;for(let i=1;i<e.pts.length;i++){const a=e.pts[i-1],b=e.pts[i],l=Math.hypot(b[0]-a[0],b[1]-a[1]);e.seg.push([a,b,l]);e.len+=l;}});
  const at=(e,s)=>{let r=s;for(const [a,b,l] of e.seg){if(r<=l){const f=l?r/l:0;return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f];}r-=l;}const p=e.pts[e.pts.length-1];return [p[0],p[1]];};
  const path=e=>e.pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
  let trams=[],uid=0,delivered=0,lives=lives0,left=dur,dead=false,raf=0,last=0,spawnT=1,elapsed=0;
  const heart=()=>'❤️'.repeat(Math.max(0,lives))+'🖤'.repeat(Math.max(0,lives0-lives));
  el.innerHTML=`<div class="gbar"><span id="gt">⏱ ${dur} s</span><span id="gs">Levert: 0 / ${need} ${heart()}</span></div>
  <svg class="tramsvg" viewBox="0 0 300 260" xmlns="${NS}" role="img" aria-label="Sporvekslere og stasjoner">
    ${Object.entries(EDGE).map(([k,e])=>`<path d="${path(e)}" fill="none" stroke="#CDBB92" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>`).join('')}
    ${Object.entries(EDGE).map(([k,e])=>`<path id="act-${k}" d="${path(e)}" fill="none" stroke="${OLc}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="display:none"/>`).join('')}
    ${['R','B','G'].map(k=>`<g><rect x="${NODE[k][0]-4}" y="${NODE[k][1]-15}" width="30" height="30" rx="8" fill="${COL[STN[k]]}" stroke="${OLc}" stroke-width="2.6"/><text x="${NODE[k][0]+11}" y="${NODE[k][1]+6}" font-size="16" text-anchor="middle">🚏</text></g>`).join('')}
    ${['E1','E2'].map(k=>`<g><circle cx="${NODE[k][0]}" cy="${NODE[k][1]}" r="8" fill="#fff" stroke="${OLc}" stroke-width="2.4"/><text x="${NODE[k][0]}" y="${NODE[k][1]+4}" font-size="10" text-anchor="middle">🏠</text></g>`).join('')}
    ${['S1','S2','M'].map(k=>`<g><circle cx="${NODE[k][0]}" cy="${NODE[k][1]}" r="11" fill="#FFC22E" stroke="${OLc}" stroke-width="2.6"/><text x="${NODE[k][0]}" y="${NODE[k][1]+5}" font-size="14" text-anchor="middle" font-weight="800" fill="${OLc}">⇅</text></g>`).join('')}
    <g id="trams"></g><g id="fx"></g>
    ${['S1','S2','M'].map(k=>`<circle class="swc" data-n="${k}" cx="${NODE[k][0]}" cy="${NODE[k][1]}" r="24" fill="transparent" style="cursor:pointer"/>`).join('')}
  </svg>
  <p class="prog">Trykk på de gule sporvekslerne for å velge vei. Send hver trikk til stasjonen 🚏 med samme farge, og unngå kollisjoner.</p>`;
  const trg=$('#trams',el),fx=$('#fx',el),dom={};
  function refresh(){
    const on=new Set(['e1','e2']);Object.keys(OUTS).forEach(n=>on.add(OUTS[n][sw[n]]));
    Object.keys(EDGE).forEach(k=>{const a=$('#act-'+k,el);if(a)a.style.display=on.has(k)?'':'none';});
  }
  function boom(x,y,txt){const t=document.createElementNS(NS,'text');t.setAttribute('x',x);t.setAttribute('y',y+5);t.setAttribute('font-size','20');t.setAttribute('text-anchor','middle');t.textContent=txt;fx.appendChild(t);delay(()=>t.remove(),700/Math.min(SP(),3));}
  function stat(){const s=$('#gs',el);if(s)s.textContent=`Levert: ${delivered} / ${need} ${heart()}`;}
  function kill(t){const d=dom[t.id];if(d){d.remove();delete dom[t.id];}trams=trams.filter(x=>x!==t);}
  function lose(){lives--;stat();if(lives<=0&&!dead){dead=true;delay(()=>fin(false,`For mange ulykker. Du leverte ${delivered} trikker`),700/Math.min(SP(),3));}}
  function spawn(){
    const k=Math.random()<.5?'e1':'e2';
    if(trams.some(t=>t.e===k&&t.s<34))return false;
    trams.push({id:++uid,e:k,s:0,c:rnd(0,2),x:0,y:0});return true;
  }
  function loop(ts){
    if(dead)return;
    const dt=last?Math.min(.05,(ts-last)/1000):0,dts=dt*SP();last=ts;
    elapsed+=dts;left-=dts;
    spawnT-=dts;
    if(spawnT<=0&&left>7){const base=g?2.5-Math.min(.8,elapsed/45*.9):3.5-Math.min(.9,elapsed/45*1.0);if(spawn())spawnT=base;else spawnT=.3;}
    for(const t of trams.slice()){
      t.s+=speed*dts;let e=EDGE[t.e];
      while(t.s>=e.len){
        const over=t.s-e.len,node=e.to;
        if(STN[node]!==undefined){
          if(STN[node]===t.c){delivered++;boom(...at(e,e.len),'✨');}else{boom(...at(e,e.len),'❌');lose();}
          stat();kill(t);break;
        }
        t.e=OUTS[node][sw[node]];t.s=over;e=EDGE[t.e];
      }
    }
    for(const t of trams){const p=at(EDGE[t.e],t.s);t.x=p[0];t.y=p[1];}
    for(let i=0;i<trams.length;i++)for(let j=i+1;j<trams.length;j++){
      const a=trams[i],b=trams[j];
      if(Math.hypot(a.x-b.x,a.y-b.y)<11){boom((a.x+b.x)/2,(a.y+b.y)/2,'💥');kill(a);kill(b);lose();i=-1;break;}
    }
    for(const t of trams){
      let d=dom[t.id];
      if(!d){d=document.createElementNS(NS,'g');d.innerHTML=`<circle r="9" fill="${COL[t.c]}" stroke="${OLc}" stroke-width="2.2"/><text y="4" font-size="11" text-anchor="middle">🚋</text>`;trg.appendChild(d);dom[t.id]=d;}
      d.setAttribute('transform',`translate(${t.x.toFixed(1)} ${t.y.toFixed(1)})`);
    }
    const gt=$('#gt',el);if(gt)gt.textContent='⏱ '+Math.max(0,Math.ceil(left))+' s';
    if(left<=0&&!dead){dead=true;return fin(delivered>=need,`Du leverte ${delivered} trikker (krav: ${need})`);}
    raf=requestAnimationFrame(loop);
  }
  $$('.swc',el).forEach(c=>c.addEventListener('pointerdown',e=>{
    e.preventDefault();if(dead)return;const n=c.dataset.n;sw[n]=(sw[n]+1)%OUTS[n].length;refresh();
  }));
  if(window.__test)el.__tram={trams:()=>trams,sw,OUTS,EDGE,STN,delivered:()=>delivered,lives:()=>lives};
  refresh();raf=requestAnimationFrame(loop);
  return ()=>{dead=true;cancelAnimationFrame(raf);};
}

const quizNeed=()=>Math.max(2,(GH()?3:2)-(EZ()?1:0));
const stripEmo=s=>String(s).replace(/[\p{Extended_Pictographic}\p{Regional_Indicator}\uFE0F\u200D]/gu,'').replace(/\s+/g,' ').trim();
function sayText(t){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='nb-NO';u.rate=.95;speechSynthesis.speak(u);}catch(e){}}
function gameJobQuiz(el,job,fin,pid){
  const qs=shuffle(PQ[pid]).map(q=>{const o=shuffle([q[1],q[2],q[3]]);return {q:q[0],o,c:o.indexOf(q[1]),e:q[4]};});
  const need=quizNeed(),canSpeak=!!window.speechSynthesis;let i=0,ok=0,locked=false,dead=false;
  el.innerHTML=`<div class="gbar"><span id="gt">Yrkesquiz</span><span id="gs">Riktige: 0 / ${need}</span></div><div id="jq"></div>`;
  function show(){
    const x=qs[i];locked=false;
    $('#gt',el).textContent=`Yrkesquiz ${i+1} / ${qs.length}`;
    $('#jq',el).innerHTML=`<div class="qrow"><div class="mascot">${mascot('hi')}</div><div class="q">${esc(x.q)}</div>${canSpeak?'<button class="say" id="jsay" aria-label="Les opp spørsmålet">🔊</button>':''}</div><div class="opts">${x.o.map((t,k)=>`<button class="opt" data-k="${k}"><span>${esc(t)}</span></button>`).join('')}</div><div class="fb" id="jfb"></div><button class="btn block" id="jnext" style="display:none">${i+1<qs.length?'Neste spørsmål':'Se resultatet'}</button>`;
    const sb=$('#jsay',el);if(sb)sb.addEventListener('click',()=>sayText(stripEmo(x.q)+'. '+x.o.map(stripEmo).join('. eller ')));
    $$('.opt',el).forEach(b=>b.addEventListener('click',()=>{
      if(dead||locked)return;locked=true;const k=+b.dataset.k,good=k===x.c;if(good)ok++;
      $$('.opt',el).forEach((o,j)=>{o.disabled=true;if(j===x.c)o.classList.add('right');else if(o===b)o.classList.add('wrong');});
      const fb=$('#jfb',el);fb.style.color=good?'var(--good)':'var(--bad)';
      fb.textContent=(good?'Riktig! ':'Ikke helt. ')+x.e;
      $('#gs',el).textContent=`Riktige: ${ok} / ${need}`;
      const nx=$('#jnext',el);nx.style.display='';
    }));
    $('#jnext',el).addEventListener('click',()=>{
      if(dead||!locked)return;i++;
      if(i>=qs.length){dead=true;try{speechSynthesis.cancel();}catch(e){}return fin(ok>=need,`Du svarte ${ok} av ${qs.length} riktig på yrkesquizen`);}
      show();
    });
  }
  show();
  return ()=>{dead=true;try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}};
}
