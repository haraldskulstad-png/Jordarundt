/* Pizzabud: planlegg den korteste veien innom alle husene */
function gameRoute(el,job,fin){
  const g=GH(),N=g?5:4,rounds=3,need=2,tol=(g?1.04:1.12)+(EZ()?.06:0),W=300,H=250,OLc='#2A1B3D';
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),mt=l=>Math.round(l*2.4);
  const PER=permsOf(N);
  let r=0,okR=0,dead=false,M=null,order=[],done=false;
  const lenOf=(o,m)=>{let l=dist(m.start,m.hs[o[0]]);for(let k=1;k<o.length;k++)l+=dist(m.hs[o[k-1]],m.hs[o[k]]);return l;};
  function make(){
    let last=null;
    for(let t=0;t<150;t++){
      const pts=[];let c=0;
      while(pts.length<N+1&&c++<500){const p={x:rnd(36,W-36),y:rnd(42,H-36)};if(pts.every(q=>dist(p,q)>62))pts.push(p);}
      if(pts.length<N+1)continue;
      const nums=shuffle([...Array(40).keys()].map(x=>x+3));
      const m={start:pts[0],hs:pts.slice(1).map((p,i)=>Object.assign(p,{no:nums[i]}))};
      const lens=PER.map(o=>lenOf(o,m));m.best=Math.min(...lens);m.bestOrder=PER[lens.indexOf(m.best)];
      last=m;
      if(lens.filter(l=>l<=m.best*tol).length<=Math.max(1,Math.ceil(PER.length*.2)))return m;
    }
    return last;
  }
  el.innerHTML=`<div class="gbar"><span id="gt">Kart 1 / ${rounds}</span><span id="gs">Riktige: 0 / ${need}</span></div>
  <svg class="routesvg" id="rsvg" viewBox="0 0 ${W} ${H}" xmlns="${NS}" role="img" aria-label="Kart med hus"></svg>
  <p class="prog" id="rinfo"></p>
  <div class="row2"><button class="btn ghost" id="rundo">↩️ Angre</button><button class="btn" id="rgo" disabled>Lever pizzaene!</button></div>
  <div class="fb" id="rfb"></div><button class="btn block" id="rnext" style="display:none">Neste kart</button>`;
  const svg=$('#rsvg',el);
  function paint(showBest){
    const pts=[M.start].concat(order.map(i=>M.hs[i]));
    const line=pts.length>1?`<polyline points="${pts.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="${OLc}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`:'';
    const bp=showBest?[M.start].concat(M.bestOrder.map(i=>M.hs[i])):null;
    const bl=bp?`<polyline points="${bp.map(p=>p.x+','+p.y).join(' ')}" fill="none" stroke="#2EC46D" stroke-width="5" stroke-dasharray="2 9" stroke-linecap="round"/>`:'';
    const houses=M.hs.map((h,i)=>{const k=order.indexOf(i);return `<g class="hs" data-i="${i}" style="cursor:pointer"><circle cx="${h.x}" cy="${h.y}" r="16" fill="${k>=0?'#FFC22E':'#fff'}" stroke="${OLc}" stroke-width="2.6"/><text x="${h.x}" y="${h.y+5}" font-size="15" text-anchor="middle">🏠</text><text x="${h.x}" y="${h.y+30}" font-size="11" font-weight="800" text-anchor="middle" fill="${OLc}">Nr ${h.no}</text>${k>=0?`<circle cx="${h.x+13}" cy="${h.y-13}" r="9" fill="#FF5E7E" stroke="${OLc}" stroke-width="2"/><text x="${h.x+13}" y="${h.y-9}" font-size="11" font-weight="800" text-anchor="middle" fill="#fff">${k+1}</text>`:''}<circle cx="${h.x}" cy="${h.y}" r="26" fill="transparent"/></g>`;}).join('');
    svg.innerHTML=`<rect width="${W}" height="${H}" fill="#CFEBB0"/><path d="M0 62H300M0 138H300M0 212H300M72 0V250M158 0V250M238 0V250" stroke="#EADDB6" stroke-width="13"/>${bl}${line}<g><circle cx="${M.start.x}" cy="${M.start.y}" r="17" fill="#FF5E7E" stroke="${OLc}" stroke-width="2.6"/><text x="${M.start.x}" y="${M.start.y+6}" font-size="17" text-anchor="middle">🍕</text></g>${houses}`;
    const len=pts.reduce((s,p,i)=>i?s+dist(pts[i-1],p):0,0);
    $('#rinfo',el).textContent=order.length?`Rute så langt: ${mt(len)} m. Husene du har valgt: ${order.length} av ${N}.`:'Trykk på husene i den rekkefølgen du vil kjøre dem.';
    $('#rgo',el).disabled=done||order.length!==N;$('#rundo',el).disabled=done||!order.length;
  }
  function start(){
    M=make();order=[];done=false;$('#gt',el).textContent=`Kart ${r+1} / ${rounds}`;$('#rfb',el).textContent='';$('#rnext',el).style.display='none';
    if(window.__test)el.__route=()=>M;paint(false);
  }
  svg.addEventListener('click',e=>{
    if(dead||done)return;const h=e.target.closest('.hs');if(!h)return;
    const i=+h.dataset.i;if(order.includes(i)){if(order[order.length-1]===i)order.pop();}else order.push(i);paint(false);
  });
  $('#rundo',el).addEventListener('click',()=>{if(dead||done)return;order.pop();paint(false);});
  $('#rgo',el).addEventListener('click',()=>{
    if(dead||done||order.length!==N)return;done=true;
    const len=lenOf(order,M),good=len<=M.best*tol;if(good)okR++;
    const fb=$('#rfb',el);fb.style.color=good?'var(--good)':'var(--bad)';
    fb.textContent=good?`Bra kjørt! ${mt(len)} m. Den korteste veien er ${mt(M.best)} m.`:`Din rute er ${mt(len)} m. Den korteste er ${mt(M.best)} m (grønn prikkelinje).`;
    $('#gs',el).textContent=`Riktige: ${okR} / ${need}`;paint(!good||len>M.best+.5);
    $('#rgo',el).disabled=true;$('#rundo',el).disabled=true;
    const nx=$('#rnext',el);nx.textContent=r+1<rounds?'Neste kart':'Se resultatet';nx.style.display='';
  });
  $('#rnext',el).addEventListener('click',()=>{
    if(dead||!done)return;r++;
    if(r>=rounds){dead=true;return fin(okR>=need,`Du kjørte ${okR} av ${rounds} ruter kort nok`);}
    start();
  });
  start();
  return ()=>{dead=true;};
}

/* Fjellguide: finn stien til toppen innenfor energien */
function gamePath(el,job,fin){
  const g=GH(),W=g?6:5,H=g?6:5,rounds=3,need=2,slack=(g?1:3)+(EZ()?1:0),tlim=g?40:55;
  let r=0,okR=0,dead=false,tm=0,G=null,path=[],used=0,budget=0,left=0,opt=0,locked=false;
  const idx=(x,y)=>y*W+x,cost=c=>c==='s'?2:1,DIR=[[1,0],[-1,0],[0,1],[0,-1]];
  function solve(Gr){
    const d=Array(W*H).fill(Infinity);d[idx(0,H-1)]=0;const q=[[0,0,H-1]];
    while(q.length){q.sort((a,b)=>a[0]-b[0]);const [dd,x,y]=q.shift();if(dd>d[idx(x,y)])continue;
      for(const [dx,dy] of DIR){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;const c=Gr[idx(nx,ny)];if(c==='x')continue;const nd=dd+cost(c);if(nd<d[idx(nx,ny)]){d[idx(nx,ny)]=nd;q.push([nd,nx,ny]);}}}
    return d[idx(W-1,0)];
  }
  function make(){
    for(let t=0;t<500;t++){
      const Gr=Array.from({length:W*H},()=>{const v=Math.random();return v<.2?'x':v<.45?'s':'n';});
      Gr[idx(0,H-1)]='n';Gr[idx(W-1,0)]='n';
      const o=solve(Gr);
      if(o<Infinity&&o>=W+H-2+2&&o<=(W+H-2)*1.8)return {Gr,o};
    }
    const Gr=Array(W*H).fill('n');for(let k=1;k<W-1;k++)Gr[idx(k,0)]='s';return {Gr,o:solve(Gr)};
  }
  el.innerHTML=`<div class="gbar"><span id="gt">Fjell 1 / ${rounds}</span><span id="gs">Riktige: 0 / ${need}</span></div>
  <div class="gbar"><span id="pe">⚡ Energi: 0</span><span id="pt">⏱ ${tlim} s</span></div>
  <div class="pgrid" id="pgrid" style="--w:${W}"></div>
  <p class="prog">Trykk på rutene ved siden av deg for å gå. Snø ❄️ koster 2, en sprekk 🕳️ kan du ikke gå over. Trykk på forrige rute for å gå ett steg tilbake.</p>
  <div class="row2"><button class="btn ghost" id="pundo">↩️ Angre</button><button class="btn ghost" id="preset">🔄 Start på nytt</button></div><div class="fb" id="pfb"></div>`;
  const grid=$('#pgrid',el);
  function paint(){
    const cur=path[path.length-1],gx=W-1,gy=0;
    grid.innerHTML=G.map((c,i)=>{
      const x=i%W,y=(i/W)|0,onp=path.findIndex(p=>p[0]===x&&p[1]===y),isCur=cur[0]===x&&cur[1]===y;
      let em=c==='x'?'🕳️':c==='s'?'❄️':'';if(x===0&&y===H-1)em='⛺';if(x===gx&&y===gy)em='🚩';if(isCur&&!(x===gx&&y===gy))em='🥾';
      return `<button class="pc ${c}${onp>=0?' on':''}${isCur?' cur':''}" data-x="${x}" data-y="${y}" aria-label="Rute ${x+1},${y+1}"><span>${em}</span>${c==='s'&&onp<0?'<i>2</i>':''}</button>`;
    }).join('');
    $('#pe',el).textContent=`⚡ Energi: ${budget-used} av ${budget}`;
  }
  function begin(){
    const m=make();G=m.Gr;opt=m.o;budget=opt+slack;path=[[0,H-1]];used=0;left=tlim;locked=false;
    $('#gt',el).textContent=`Fjell ${r+1} / ${rounds}`;$('#pfb',el).textContent='';
    if(window.__test)el.__path=()=>({G,W,H,budget,opt,used,path,tap:(x,y)=>click(x,y)});
    paint();clearInterval(tm);
    tm=setInterval(()=>{if(dead||locked)return;left--;const t=$('#pt',el);if(t)t.textContent='⏱ '+Math.max(0,left)+' s';if(left<=0)end(false,'Tiden gikk ut');},1000/SP());
  }
  function end(ok,msg){
    if(locked||dead)return;locked=true;clearInterval(tm);if(ok)okR++;
    const fb=$('#pfb',el);fb.style.color=ok?'var(--good)':'var(--bad)';fb.textContent=msg;
    $('#gs',el).textContent=`Riktige: ${okR} / ${need}`;
    delay(()=>{if(dead)return;r++;if(r>=rounds){dead=true;return fin(okR>=need,`Du nådde toppen på ${okR} av ${rounds} fjell`);}begin();},1100/Math.min(SP(),4));
  }
  function click(x,y){
    if(dead||locked)return;const cur=path[path.length-1];
    if(path.length>1&&x===path[path.length-2][0]&&y===path[path.length-2][1]){const c=G[idx(cur[0],cur[1])];used-=cost(c);path.pop();paint();return;}
    if(Math.abs(x-cur[0])+Math.abs(y-cur[1])!==1)return;
    if(path.some(p=>p[0]===x&&p[1]===y))return;
    const c=G[idx(x,y)];const fb=$('#pfb',el);
    if(c==='x'){fb.style.color='var(--bad)';fb.textContent='Sprekk! Der kan du ikke gå.';return;}
    if(used+cost(c)>budget){fb.style.color='var(--bad)';fb.textContent='Du har ikke energi nok til det steget. Prøv en annen vei.';return;}
    fb.textContent='';used+=cost(c);path.push([x,y]);paint();
    if(x===W-1&&y===0)end(true,'Du nådde toppen! 🚩');
  }
  grid.addEventListener('click',e=>{const b=e.target.closest('.pc');if(!b)return;click(+b.dataset.x,+b.dataset.y);});
  $('#pundo',el).addEventListener('click',()=>{if(dead||locked||path.length<2)return;const cur=path[path.length-1];used-=cost(G[idx(cur[0],cur[1])]);path.pop();paint();});
  $('#preset',el).addEventListener('click',()=>{if(dead||locked)return;path=[[0,H-1]];used=0;$('#pfb',el).textContent='';paint();});
  begin();
  return ()=>{dead=true;clearInterval(tm);};
}

/* Bakerlærling og kokk: halver (eller gang) oppskriften */
const HVB=[
 {e:'🥚',n:'egg',u:'',h:[2,4,6,8],h2:[2,4,6,8],q:[4,8,12],d:[1,2,3,4]},
 {e:'🥛',n:'melk',u:'dl',h:[2,4,6,8,10],h2:[3,5,7,9],q:[4,8,12],d:[1,2,3,4]},
 {e:'🌾',n:'mel',u:'dl',h:[2,4,6,8],h2:[3,5,7,9],q:[4,8,12],d:[1,2,3,4]},
 {e:'🍬',n:'sukker',u:'ss',h:[2,4,6],h2:[3,5],q:[4,8],d:[1,2,3]},
 {e:'🧈',n:'smør',u:'g',h:[100,200,300,400],h2:[150,250,350],q:[200,400,800],d:[50,100,150,200]},
 {e:'🍯',n:'honning',u:'ss',h:[2,4,6],h2:[3,5],q:[4,8],d:[1,2,3]},
 {e:'🧀',n:'ost',u:'g',h:[100,200,300,400],h2:[150,250,350],q:[200,400,800],d:[50,100,150,200]},
 {e:'🧂',n:'salt',u:'ts',h:[2,4],h2:[1,3],q:[4],d:[1,2]},
 {e:'🍎',n:'epler',u:'',h:[2,4,6,8],h2:[2,4,6,8],q:[4,8],d:[1,2,3,4]},
 {e:'🍅',n:'tomater',u:'',h:[2,4,6,8],h2:[2,4,6,8],q:[4,8],d:[1,2,3,4]},
 {e:'🍫',n:'sjokolade',u:'g',h:[100,200,300,400],h2:[150,250,350],q:[200,400,800],d:[50,100,150,200]},
 {e:'💧',n:'vann',u:'dl',h:[2,4,6,8],h2:[3,5,7,9],q:[4,8,12],d:[1,2,3,4]}
];
function gameHalve(el,job,fin){
  const g=GH(),n=g?5:4,need=Math.max(2,(g?4:3)-(EZ()?1:0));
  const fmtN=v=>String(+Number(v).toFixed(1)).replace('.',',');
  const txt=(it,v)=>`${fmtN(v)} ${it.u?it.u+' ':''}${it.n}`;
  const kinds=g?shuffle(['half','half','quarter','double','half']):Array(n).fill('half');
  const qs=shuffle(HVB).slice(0,n).map((it,i)=>{
    const kind=kinds[i];let base,ans,p1,p2,expl;
    if(kind==='half'){const arr=(g&&Math.random()<.5)?it.h2:it.h;base=arr[rnd(0,arr.length-1)];ans=base/2;p1=[4,6,8][rnd(0,2)];p2=p1/2;expl=`Halvparten av ${fmtN(base)} er ${fmtN(ans)}.`;}
    else if(kind==='quarter'){base=it.q[rnd(0,it.q.length-1)];ans=base/4;p1=8;p2=2;expl=`En fjerdedel av ${fmtN(base)} er ${fmtN(ans)}.`;}
    else{base=it.d[rnd(0,it.d.length-1)];ans=base*2;p1=[2,4][rnd(0,1)];p2=p1*2;expl=`Dobbelt av ${fmtN(base)} er ${fmtN(ans)}.`;}
    const step=it.u==='g'?50:1;
    const cands=kind==='half'?[base,base*2,ans+step,ans-step]:kind==='quarter'?[base,base/2,ans+step,ans*3]:[base,base*3,ans+step,ans-step];
    const wrong=shuffle([...new Set(cands.filter(v=>v>0&&Math.abs(v-ans)>1e-9))]).slice(0,3);
    while(wrong.length<3){const v=ans+step*(wrong.length+2);if(!wrong.includes(v))wrong.push(v);}
    const opts=shuffle([ans].concat(wrong));
    return {it,kind,base,ans,p1,p2,expl,opts,ci:opts.indexOf(ans)};
  });
  let i=0,ok=0,locked=false,dead=false;
  el.innerHTML=`<div class="gbar"><span id="gt">Oppskrift 1 / ${n}</span><span id="gs">Riktige: 0 / ${need}</span></div><div id="hq"></div>`;

    $('#hq',el).innerHTML=`<div class="qrow"><div class="mascot">${mascot('hi')}</div><div class="q">Oppskriften er til ${x.p1} personer. Du skal lage til ${x.p2}. Hvor mye ${x.it.n} trenger du?</div></div><div class="rline">${x.it.e} ${txt(x.it,x.base)} <small>til ${x.p1} personer</small></div><div class="opts">${x.opts.map((v,k)=>`<button class="opt" data-k="${k}"><span>${x.it.e} ${txt(x.it,v)}</span></button>`).join('')}</div><div class="fb" id="hfb"></div><button class="btn block" id="hnext" style="display:none">${i+1<n?'Neste':'Se resultatet'}</button>`;
    $$('.opt',el).forEach(b=>b.addEventListener('click',()=>{
      if(dead||locked)return;locked=true;const k=+b.dataset.k,good=k===x.ci;if(good)ok++;
      $$('.opt',el).forEach((o,j)=>{o.disabled=true;if(j===x.ci)o.classList.add('right');else if(o===b)o.classList.add('wrong');});
      const fb=$('#hfb',el);fb.style.color=good?'var(--good)':'var(--bad)';fb.textContent=(good?'Riktig! ':'Ikke helt. ')+x.expl;
      $('#gs',el).textContent=`Riktige: ${ok} / ${need}`;$('#hnext',el).style.display='';
    }));
    $('#hnext',el).addEventListener('click',()=>{
      if(dead||!locked)return;i++;
      if(i>=n){dead=true;return fin(ok>=need,`Du regnet ut ${ok} av ${n} mengder riktig`);}
      show();
    });
  }
  show();
  return ()=>{dead=true;};
}

/* Basarselger og tepphandler: velg best kjøp (lavest pris per stykk) */
function gameDeal(el,job,fin){
  const g=GH(),k=g?3:2,rounds=5,need=Math.max(3,4-(EZ()?1:0));
  const items=(job&&job.items&&job.items.length)?job.items:['krydderposer','tekanner'];
  const EM=s=>/tepp/.test(s)?'🧶':/krydder/.test(s)?'🌶️':/tekanne/.test(s)?'🫖':'🛍️';
  const mult=s=>/tepp/.test(s)?10:1;
  function make(){
    const nm=items[rnd(0,items.length-1)],m=mult(nm);
    for(let t=0;t<300;t++){
      const used=new Set(),offers=[];
      for(let i=0;i<k;i++){let q,u,c=0;do{q=rnd(2,g?8:6);u=rnd(g?5:6,g?19:18)*m;c++;}while(used.has(u)&&c<30);used.add(u);offers.push({q,u,t:q*u});}
      const us=offers.map(o=>o.u).sort((a,b)=>a-b);
      if((us[1]-us[0])/m<(g?1:2)||us[0]===us[1])continue;
      const best=offers.findIndex(o=>o.u===us[0]);
      return {nm,offers,best,m};
    }
    return {nm,offers:[{q:3,u:10*m,t:30*m},{q:5,u:8*m,t:40*m}].slice(0,k).concat(k>2?[{q:4,u:9*m,t:36*m}]:[]),best:1,m};
  }
  const Q=Array.from({length:rounds},make);
  let i=0,ok=0,locked=false,dead=false;
  el.innerHTML=`<div class="gbar"><span id="gt">Handel 1 / ${rounds}</span><span id="gs">Riktige: 0 / ${need}</span></div><div id="dq"></div>`;
  function show(){
    const x=Q[i];locked=false;$('#gt',el).textContent=`Handel ${i+1} / ${rounds}`;
    if(window.__test)el.__dq=()=>x;
    const em=EM(x.nm);
    $('#dq',el).innerHTML=`<div class="qrow"><div class="mascot">${mascot('hi')}</div><div class="q">Du kjøper inn ${esc(x.nm)}. Hvilket tilbud er best kjøp, altså lavest pris per stk?</div></div><div class="offers">${x.offers.map((o,j)=>`<button class="offer" data-k="${j}"><span class="oe">${em.repeat(o.q)}</span><b>${o.q} stk for ${fmt(o.t)} kr</b></button>`).join('')}</div><div class="fb" id="dfb"></div><button class="btn block" id="dnext" style="display:none">${i+1<rounds?'Neste handel':'Se resultatet'}</button>`;
    $$('.offer',el).forEach(b=>b.addEventListener('click',()=>{
      if(dead||locked)return;locked=true;const j=+b.dataset.k,good=j===x.best;if(good)ok++;
      $$('.offer',el).forEach((o,q)=>{o.disabled=true;if(q===x.best)o.classList.add('right');else if(o===b)o.classList.add('wrong');});
      const fb=$('#dfb',el);fb.style.color=good?'var(--good)':'var(--bad)';
      fb.textContent=(good?'Riktig! ':'Ikke helt. ')+'Pris per stk: '+x.offers.map(o=>fmt(o.u)+' kr').join(', ')+'.';
      $('#gs',el).textContent=`Riktige: ${ok} / ${need}`;$('#dnext',el).style.display='';
    }));
    $('#dnext',el).addEventListener('click',()=>{
      if(dead||!locked)return;i++;
      if(i>=rounds){dead=true;return fin(ok>=need,`Du fant det beste kjøpet ${ok} av ${rounds} ganger`);}
      show();
    });
  }
  show();
  return ()=>{dead=true;};
}

/* ----- Minispill: regning ----- */
function gameMath(el,job,fin){
  const g=GH(),total=5,need=(g?4:3)-(EZ()?1:0);let time=(g?40:70)+(EZ()?15:0),i=0,ok=0,done=false,cur=null;

  const inp=$('#ma',el);
  function next(){
    if(i>=total)return end();
    const a=g?rnd(3,9):rnd(1,3),b=g?rnd(2,8):rnd(1,3),p=g?rnd(12,48):5*rnd(1,4),q=g?rnd(9,39):5*rnd(1,3);
    cur=a*p+b*q;
    $('#mq',el).innerHTML=`Kunden kjøper ${a} ${job.items[0]} à ${p} kr og ${b} ${job.items[1]} à ${q} kr.<br>Hva blir regningen?`;
    inp.value='';inp.focus();
  }
  function submit(){
    if(done||cur===null)return;

    $('#gs',el).textContent=`Riktige: ${ok} / ${need}`;
    cur=null;i++;setTimeout(()=>{if(!done)next();},good?400:1100);
  }
  function end(){if(done)return;done=true;clearInterval(tm);fin(ok>=need,`Du regnet ${ok} av ${total} riktig`);}
  $('#mok',el).addEventListener('click',submit);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')submit();});
  const tm=setInterval(()=>{time--;const t=$('#gt',el);if(t)t.textContent='⏱ '+time+' s';if(time<=0)end();},1000);
  next();
  return ()=>{done=true;clearInterval(tm);};
}

/* ----- Minispill: rekkefølge ----- */
function gameSimon(el,job,fin){
  const g=GH(),n=g?6:4,tgt=g?7:5;let lives=(g?1:2)+(EZ()?1:0);
  const sym=TH[job.th].slice(0,n);
  let seq=[],pos=0,accepting=false,alive=true;
  el.innerHTML=`<div class="gbar"><span id="gt">Runde 1 / ${tgt}</span><span id="gs">${'❤️'.repeat(lives)}</span></div><div class="pads p${n}" id="pads">${sym.map((s,k)=>`<button class="pad pad${k}" data-k="${k}" aria-label="Felt ${k+1}">${s}</button>`).join('')}</div><div class="status" id="st"></div>`;
  const pads=$$('.pad',el);
  const status=t=>{const s=$('#st',el);if(s)s.textContent=t;};
  const later=(f,ms)=>setTimeout(()=>{if(alive)f();},ms);
  function addAndPlay(){seq.push(rnd(0,n-1));$('#gt',el).textContent=`Runde ${seq.length} / ${tgt}`;play();}
  function play(){
    accepting=false;pos=0;status('Se godt etter …');
    const speed=g?420:600;let k=0;
    function flash(){
      if(k>=seq.length){accepting=true;status('Din tur!');return;}
      const p=pads[seq[k]];p.classList.add('lit');
      later(()=>{p.classList.remove('lit');k++;later(flash,160);},speed);
    }
    later(flash,600);
  }
  function end(ok){const was=alive;alive=false;if(!was)return;setTimeout(()=>{if(!cleanupCalled)fin(ok,ok?`Du klarte alle ${tgt} rundene`:`Du kom til runde ${seq.length} av ${tgt}`);},400);}
  let cleanupCalled=false;
  $('#pads',el).addEventListener('click',e=>{
    const b=e.target.closest('.pad');if(!b||!accepting)return;
    const k=+b.dataset.k;b.classList.add('lit');setTimeout(()=>b.classList.remove('lit'),160);
    if(k===seq[pos]){
      pos++;
      if(pos===seq.length){
        accepting=false;
        if(seq.length>=tgt){end(true);return;}
        status('Bra!');later(addAndPlay,800);
      }
    }else{
      lives--;accepting=false;
      $('#gs',el).textContent=lives>0?'❤️'.repeat(lives):'💔';
      if(lives<=0){status('Feil!');end(false);}
      else{status('Feil! Se rekkefølgen en gang til.');later(play,1100);}
    }
  });
  later(addAndPlay,300);
  return ()=>{alive=false;cleanupCalled=true;};
}

/* ----- Minispill: treff sonen ----- */
function gameTiming(el,job,fin){
  const g=GH(),rounds=5,need=g?4:3,zw=(g?14:26)+(EZ()?8:0),speed=g?110:75;
  let r=0,hits=0,pos=0,dir=1,zl=0,run=false,dead=false,last=0,raf=0;
  el.innerHTML=`<div class="gbar"><span id="gt">Forsøk 1 / ${rounds}</span><span id="gs">Treff: 0 / ${need}</span></div><p>${job.tm}</p><div class="tbar"><div class="tzone" id="tz"></div><div class="tcur" id="tc"></div></div><button class="btn block" id="tstop">Stopp!</button><div class="fb" id="tfb"></div>`;
  const tz=$('#tz',el),tc=$('#tc',el),fb=$('#tfb',el);
  function nr(){zl=rnd(8,92-zw);tz.style.left=zl+'%';tz.style.width=zw+'%';pos=0;dir=1;run=true;$('#gt',el).textContent=`Forsøk ${r+1} / ${rounds}`;fb.textContent='';}
  function loop(t){
    if(dead)return;
    if(run){const dt=last?Math.min(.05,(t-last)/1000):0;pos+=dir*speed*dt*(1+r*0.08);if(pos>=100){pos=100;dir=-1;}if(pos<=0){pos=0;dir=1;}tc.style.left=`calc(${pos}% - 3px)`;}
    last=t;raf=requestAnimationFrame(loop);
  }
  $('#tstop',el).addEventListener('click',()=>{
    if(!run)return;run=false;
    const ok=pos>=zl&&pos<=zl+zw;if(ok)hits++;r++;
    fb.style.color=ok?'var(--good)':'var(--bad)';fb.textContent=ok?'Blink! 🎯':'Forbi …';
    $('#gs',el).textContent=`Treff: ${hits} / ${need}`;
    if(r>=rounds)setTimeout(()=>{if(!dead){dead=true;cancelAnimationFrame(raf);fin(hits>=need,`Du traff ${hits} av ${rounds}`);}},600);
    else setTimeout(()=>{if(!dead)nr();},700);
  });
  nr();raf=requestAnimationFrame(loop);
  return ()=>{dead=true;cancelAnimationFrame(raf);};

  const field=$('#field',el),bask=$('#bask',el);

/* ---------- Innsjekking på hotellet: spørsmål + finn byene på kartet ---------- */
function ciTier(c){return (S.ci&&S.ci.id===c.id)?Math.min(2,S.ci.tier+(S.hotel==='dyrt'?1:0)):-1;}
const CITXT=['bare enkle jobber (⭐)','enkle og vanlige jobber (⭐⭐)','alle jobber, også krevende (⭐⭐⭐)'];
function checkinQuestions(c){
  const n=S.diff==='g'?4:3,seen=S.qSeen;
  const geo=shuffle([()=>qCountry(c,n),()=>qContinent(c,n),()=>qFlagFor(c.iso,n),()=>qFlagToCountry(c.iso,n)]).map(f=>f()).filter(Boolean);
  const q1=geo.find(q=>!seen[q.id])||geo[0];
  const facts=shuffle([0,1,2]).map(i=>qFact(c,i)).filter(Boolean);
  const authored=shuffle(c.q.map((q,i)=>({id:'a:'+c.id+':'+i,e:q[0],t:q[1],a:q[2],o:shuffle(q.slice(2)),ex:qEx(c,i)})));
  const pool=facts.concat(authored).filter(q=>parseOpt(q.a).l.toLowerCase()!==parseOpt(q1.a).l.toLowerCase());
  const q2=pool.find(q=>!seen[q.id])||pool[0];
  [q1,q2].forEach(q=>{seen[q.id]=1;});
  return [q1,q2];
}
function runQs(qs,title,cb){

      <div class="opts">${q.o.map((o,k)=>{const p=parseOpt(o);return `<button class="opt" data-act="ans" data-k="${k}"><span class="oe ${p.l?'':'big'}">${p.e}</span><span>${p.l}</span></button>`;}).join('')}</div><div id="qnext"></div>`);
    window.__ans=function(k){
      window.__ans=null;
      const ok=q.o[k]===q.a;if(ok)right++;
      $$('.opt',mroot).forEach((b,n)=>{b.disabled=true;if(q.o[n]===q.a)b.classList.add('right');else if(n===k)b.classList.add('wrong');});

function checkinMap(cb){
  const c=city(S.cur),g=S.diff==='g';
  let region=c.rg;
  const inReg=x=>{const b=REG[region].b;return x.lon>=b[0]&&x.lon<=b[2]&&x.lat<=b[1]&&x.lat>=b[3];};
  let pool=CITIES.filter(x=>x.id!==c.id&&inReg(x));
  if(pool.length<3){region='world';pool=CITIES.filter(x=>x.id!==c.id);}
  const targets=shuffle(pool).slice(0,6),vb=vbFor(region),tol=vb.w*(g?0.04:0.06),u=vb.w/330;
  let time=g?20:30,r=0,hits=0,locked=false,dead=false;
  openModal(head('Innsjekking: finn byene')+`<div class="gbar"><span id="gt">⏱ ${time} s</span><span id="gs">Funnet: 0</span></div><div class="mq" id="mq" style="min-height:0"></div><div class="mapgame"><svg class="wm" id="gm" viewBox="${vb.x.toFixed(1)} ${vb.y.toFixed(1)} ${vb.w.toFixed(1)} ${vb.h.toFixed(1)}" xmlns="${NS}">${MAPSTATIC}<g id="gmh"><circle cx="${px(c.lon)}" cy="${py(c.lat)}" r="${5*u}" fill="var(--accent)" stroke="#fff" stroke-width="${1.8*u}"/><text class="lbl" x="${px(c.lon)}" y="${py(c.lat)-9*u}" font-size="${11*u}" stroke-width="${3*u}" text-anchor="middle">Du er her</text></g><g id="gmk"></g></svg></div><div class="fb" id="gfb"></div>`);
  const gm=$('#gm'),mk=$('#gmk'),fb=$('#gfb');
  const finish=()=>{if(dead)return;dead=true;clearInterval(tm);cleanup=null;setTimeout(()=>cb(hits),500);};
  function show(){
    if(r>=targets.length)return finish();
    const t=targets[r];$('#mq').innerHTML=`Trykk der du tror <b>${flagOf(t.iso)} ${t.n}</b> ligger.`;mk.innerHTML='';fb.textContent='';locked=false;
  }
  gm.addEventListener('click',e=>{
    if(locked||dead)return;
    const rc=gm.getBoundingClientRect();if(!rc.width)return;
    const x=vb.x+(e.clientX-rc.left)/rc.width*vb.w,y=vb.y+(e.clientY-rc.top)/rc.height*vb.h,t=targets[r];
    const tx=px(t.lon),ty=py(t.lat),good=Math.hypot(x-tx,y-ty)<=tol;locked=true;if(good)hits++;
    mk.innerHTML=`<line x1="${x}" y1="${y}" x2="${tx}" y2="${ty}" stroke="var(--ink)" stroke-width="${2*u}" stroke-dasharray="${5*u} ${4*u}"/><circle cx="${x}" cy="${y}" r="${5*u}" fill="var(--accent)" stroke="#fff" stroke-width="${1.8*u}"/><circle cx="${tx}" cy="${ty}" r="${5*u}" fill="var(--good)" stroke="#fff" stroke-width="${1.8*u}"/><text class="lbl" x="${tx}" y="${ty-9*u}" font-size="${11*u}" stroke-width="${3*u}" text-anchor="middle">${t.n}</text>`;
    fb.style.color=good?'var(--good)':'var(--bad)';fb.textContent=good?'Riktig!':'Litt feil. Grønn prikk viser hvor byen ligger.';
    $('#gs').textContent='Funnet: '+hits;r++;
    setTimeout(()=>{if(!dead)show();},good?600:1200);
  });
  const tm=setInterval(()=>{time--;const el=$('#gt');if(el)el.textContent='⏱ '+time+' s';if(time<=0)finish();},1000);
  cleanup=()=>{dead=true;clearInterval(tm);};
  show();
}
function startCheckin(){
  const c=city(S.cur);
  if(S.ci&&S.ci.id===c.id)advance(1);
  const qs=checkinQuestions(c);
  runQs(qs,'Innsjekking: spørsmål',right=>checkinMap(hits=>{
    const g=S.diff==='g',mp=hits>=(g?5:4)?3:hits>=(g?4:3)?2:hits>=2?1:0,p=right+mp,tier=p>=4?2:p>=2?1:0;

function openSights(){
  const c=city(S.cur),list=SIGHTS[c.id],seen=S.seen[c.id]||[];
  const rows=list.map((s,i)=>`<button class="sight ${seen.includes(i)?'done':''}" data-act="sight" data-i="${i}">${photoFor(c.id,i)?`<img class="sth" src="photos/${esc(photoFor(c.id,i).f)}" alt="" loading="lazy">`:`<span class="se">${s[0]}</span>`}<span class="st"><b>${s[1]}</b><small>${seen.includes(i)?s[2]:'Trykk for å se'}</small></span><span class="chk">${seen.includes(i)?'✔':'›'}</span></button>`).join('');
  openModal(head('Sightseeing i '+c.n)+hero(c.id,c.lm)+`<p class="prog">Du har sett ${seen.length} av ${list.length}. Hver severdighet du har sett gir deg ett hint i byquizen (💡 tar bort ett feil svar).</p>${rows}`);

function viewSight(i){
  const c=city(S.cur),s=SIGHTS[c.id][i];if(!s)return;
  S.seen[c.id]=S.seen[c.id]||[];
  const first=!S.seen[c.id].includes(i);
  if(first){S.seen[c.id].push(i);addLog(`📸 Du så ${s[1]} i ${c.n}.`);renderLog();renderHere();}
  const n=S.seen[c.id].length;
  openModal(head(s[1])+`<div class="result">${photoFor(c.id,i)?`<div class="hero photo"><img class="ph" src="photos/${esc(photoFor(c.id,i).f)}" alt="">${crLine(photoFor(c.id,i))}</div>`:`<div class="big" style="font-size:84px">${s[0]}</div>`}<h3>${s[1]}</h3><div class="fact" style="text-align:left">💡 ${s[2]}</div><p>${first?'Nytt!':'Du har sett denne før.'} Du har sett ${n} av 3 i ${c.n}${S.stamps[c.id]?'':', og får '+n+' hint i byquizen'}.</p><button class="btn block" data-act="sights">Tilbake til sightseeing</button></div>`);
}

    <li><b>Innsjekking:</b> på hotellet svarer du på to spørsmål og finner byer på kartet. Jo bedre du gjør det, jo flere av jobbene i avisen kan du søke på. Du må sjekke inn på nytt i hver by.</li>
    <li><b>Jobbavisen</b> har tre annonser i hver by: enkel (⭐), vanlig (⭐⭐) og krevende (⭐⭐⭐). Høy lønnsklasse betaler mer, men er vanskeligere og krever sertifikater. Stempel fra byquizen og dyrt hotell gjør kravene lavere.</li>

/* ---------- Hall of Fame ---------- */
const HOF_KEY='jr-hof';let HOF_MEM=[];
const hofOk=e=>e&&typeof e.name==='string'&&isFinite(e.day)&&isFinite(e.earned)&&isFinite(e.lands)&&isFinite(e.certs);
function hofLoad(){try{const v=localStorage.getItem(HOF_KEY);if(v){const a=JSON.parse(v);if(Array.isArray(a))return a.filter(hofOk);}return HOF_MEM.filter(hofOk);}catch(e){return HOF_MEM.filter(hofOk);}}
function hofStore(a){HOF_MEM=a;try{localStorage.setItem(HOF_KEY,JSON.stringify(a));}catch(e){}}
function lastName(){try{return localStorage.getItem('jr-name')||'';}catch(e){return '';}}
function setLastName(n){try{localStorage.setItem('jr-name',n);}catch(e){}}
const HOF_SORTS={
  time:{ico:'⏱',lab:'Raskest',key:'day',dir:1,txt:e=>e.day+' dager'},
  money:{ico:'💰',lab:'Mest penger',key:'earned',dir:-1,txt:e=>fmt(e.earned)+' kr'},
  lands:{ico:'🌍',lab:'Flest land',key:'lands',dir:-1,txt:e=>e.lands+' land'},
  certs:{ico:'📜',lab:'Flest sertifikater',key:'certs',dir:-1,txt:e=>e.certs+' sertifikater'}
};
function hofCmp(k){const s=HOF_SORTS[k];return (a,b)=>{let d=(a[s.key]-b[s.key])*s.dir;if(d)return d;d=a.day-b.day;if(d)return d;d=b.earned-a.earned;if(d)return d;d=b.lands-a.lands;if(d)return d;d=b.certs-a.certs;if(d)return d;return (a.t||0)-(b.t||0);};}
function hofRank(list,e,k){const s=HOF_SORTS[k];return 1+list.filter(x=>x.id!==e.id&&((x[s.key]-e[s.key])*s.dir)<0).length;}
function hofNameModal(){
  const pre=lastName();
  openModal(`<div class="result"><div class="mascot big">${mascot('win')}</div><div class="big">🏆</div><h3>Du kom jorda rundt!</h3><p>Skriv navnet ditt for å komme i Hall of Fame og se resultatet.</p><input id="hofname" class="hofinput" type="text" maxlength="18" autocomplete="off" autocapitalize="words" placeholder="Navnet ditt" value="${esc(pre)}" aria-label="Navn"><button class="btn block" id="hofok" data-act="hofsave"${pre.trim()?'':' disabled'}>Lagre og se resultatet</button></div>`);
  const inp=$('#hofname'),ok=$('#hofok');
  if(inp&&ok){
    inp.addEventListener('input',()=>{ok.disabled=!inp.value.trim();});
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!ok.disabled)ok.click();});
    setTimeout(()=>{try{inp.focus();inp.select();}catch(e){}},60);
  }
}
function showWinV(){
  const e=S.hofEntry,list=hofLoad();
  const best=getBest(S.diff),rec=!best||e.day<best;if(rec)setBest(S.diff,e.day);
  const rank=e.day<=40?'Globetrotter':e.day<=70?'Erfaren reisende':'Turist';
  const rks=Object.keys(HOF_SORTS).map(k=>`<div class="hrk"><span>${HOF_SORTS[k].ico} ${HOF_SORTS[k].lab}</span><b>nr. ${hofRank(list,e,k)} av ${list.length}</b></div>`).join('');
  openModal(`<div class="result"><div class="mascot big">${mascot('win')}</div><div class="big">🏆</div><h3>Bra jobba, ${esc(e.name)}!</h3><div class="stamp">${rank.toUpperCase()}</div><p>Du besøkte alle seks verdensdeler og kom hjem til Oslo på <b>${e.day} dager</b>.<br>Du tjente ${fmt(e.earned)} kr, besøkte ${e.lands} land og tok ${e.certs} sertifikater.<br>${rec?'🎉 Ny rekord for dette nivået!':'Rekorden din er '+best+' dager.'}</p><div class="hofranks">${rks}</div><button class="btn block" data-act="hof" data-s="time" data-h="${esc(e.id)}">🏆 Se Hall of Fame</button><p></p><button class="btn block ghost" data-act="cont">Fortsett å utforske</button><p></p><button class="btn block ghost" data-act="newgame">Ny reise</button></div>`);
}
function openHof(k,hid){
  if(!HOF_SORTS[k])k='time';
  const all=hofLoad(),list=all.slice().sort(hofCmp(k));
  const tabs=Object.keys(HOF_SORTS).map(x=>`<button class="hoftab${x===k?' on':''}" data-act="hofsort" data-s="${x}" data-h="${esc(hid||'')}">${HOF_SORTS[x].ico} ${HOF_SORTS[x].lab}</button>`).join('');
  const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':String(i+1);
  const dt=e=>{try{return new Date(e.t).toLocaleDateString('nb-NO',{day:'numeric',month:'short'});}catch(x){return '';}};
  const rows=list.slice(0,30).map((e,i)=>`<li class="hofrow${e.id===hid?' me':''}"><span class="hr">${medal(i)}</span><div class="hn"><b>${esc(e.name)}</b><small>${e.diff==='g'?'Globetrotter':'Turist'}${e.t?' · '+dt(e):''}</small></div><div class="hs">${Object.keys(HOF_SORTS).map(x=>`<span class="m${x===k?' act':''}">${HOF_SORTS[x].ico} ${HOF_SORTS[x].txt(e)}</span>`).join('')}</div></li>`).join('');
  openModal(head('🏆 Hall of Fame')+`<div class="hoftabs">${tabs}</div>`+(list.length?`<ol class="hoflist">${rows}</ol>`:'<p class="prog">Ingen er i Hall of Fame ennå. Kom jorda rundt for å bli den første!</p>')+`<p class="prog">Sorter etter tid, penger, land eller sertifikater. Penger tjent er alt du har fått inn på jobber, quiz, telefonsamtaler og suvenirsalg. Listen lagres bare på denne enheten.</p>`+(list.length?'<button class="btn ghost block" data-act="hofclear">Tøm listen</button>':''));
}

/* ---------- Seier ---------- */
function checkWin(){
  if(S.won||!goalDone())return;
  S.won=true;
  const st=Object.keys(S.stamps).length,ce=Object.keys(S.certs).length,lands=Object.keys(S.countries).length;
  if(S.goal==='v'){
    S.hofPending={diff:S.diff,day:S.day,earned:S.earned||0,lands,certs:ce};
    hofNameModal();
  }else{
    const score=Math.max(0,Math.round(5000+S.money/2+st*60+ce*90-S.day*30));
    const rank=S.day<=60?'Globetrotter':S.day<=100?'Erfaren reisende':'Turist';
    openModal(`<div class="result"><div class="mascot big">${mascot('win')}</div><div class="big">🏆</div><h3>Målet er nådd!</h3><div class="stamp">${rank.toUpperCase()}</div><p>Du brukte ${S.day} dager, har ${fmt(S.money)} kr igjen, ${st} stempler og ${ce} sertifikater.<br><b>Poengsum: ${fmt(score)}</b></p><button class="btn block" data-act="cont">Fortsett å utforske</button><p></p><button class="btn block ghost" data-act="newgame">Ny reise</button></div>`);
  }
}

  shop:()=>{if(!S.busy)openShop();},
  buy:d=>{buyItem(d.id);},
  sell:d=>{sellItem(+d.i);},
  cont:()=>{closeModal();render();checkWin();},
  pin:d=>{if(S.busy)return;S.sel=(S.sel===d.id)?null:d.id;highlight();drawDyn();renderSel();},
  reg:d=>{S.region=d.r;render();},

  },
  names:()=>{S.names=!S.names;render();},
  quiz:()=>{if(!S.busy)startQuiz();},
  job:()=>{if(!S.busy)openAds();},
  ad:d=>{startJob(+d.i);},
  jobgo:d=>{runJob(+d.i);},
  travel:d=>{if(!S.busy)openTravel(d.id);},
  go:d=>{doTravel(d.to,d.m);},
  ans:d=>{if(window.__ans)window.__ans(+d.k);},
  qnext:()=>{if(window.__next)window.__next();},
  say:()=>{if(window.__say)window.__say();},
  hint:()=>{if(window.__hint)window.__hint();},
  sights:()=>{if(!S.busy)openSights();},
  sight:d=>{viewSight(+d.i);},
  pass:()=>{openPass();},
  help:()=>{openHelp();},
  menu:()=>{openMenu();},
  credits:()=>{openCredits();},
  newgame:()=>{closeModal();S=null;renderStart();},
  hof:d=>{openHof(d.s||'time',d.h);},
  hofsort:d=>{openHof(d.s,d.h);},
  hofsave:()=>{
    const inp=$('#hofname');const name=((inp&&inp.value)||'').replace(/\s+/g,' ').trim().slice(0,18);
    if(!name||!S||!S.hofPending)return;
    const e=Object.assign({name,id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),t:Date.now()},S.hofPending);
    S.hofPending=null;S.hofEntry=e;setLastName(name);
    hofStore(hofLoad().concat([e]).slice(-300));
    showWinV();
  },
  hofclear:(d,t)=>{
    if(t.dataset.sure){hofStore([]);openHof('time');}
    else{t.dataset.sure='1';t.textContent='Trykk én gang til for å tømme listen';}
  }
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t||t.disabled)return;
  const f=ACT[t.dataset.act];
  if(f)f(t.dataset,t);
});
let rz=null;
window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S&&$('#mapsvg')&&!S.busy)drawDyn();},150);});
document.addEventListener('error',e=>{
  const t=e.target;
  if(t&&t.tagName==='IMG'&&t.classList&&(t.classList.contains('ph')||t.classList.contains('sth'))){
    const par=t.parentNode;t.remove();if(par)par.querySelectorAll('.cr').forEach(x=>x.remove());
  }
},true);
renderStart();
if(window.fetch&&/^https?:$/.test(location.protocol)){
  fetch('photos/photos.json').then(r=>r.ok?r.json():null).then(j=>{if(j){PH=j;if(S&&$('#mapsvg'))renderHere();}}).catch(()=>{});
}
})();
</script>
<script>
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
</script>
